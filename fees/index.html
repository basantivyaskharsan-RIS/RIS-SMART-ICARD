<style>
:root{--bg:#eef2f6;--ink:#1a2433;--mute:#5b6878;--line:#b7c4d4;--navy:#1d4f91;--green:#1a8a4a;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.5 "Noto Sans Devanagari",system-ui,sans-serif;color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:12px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h1{font-size:19px;color:var(--navy);margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:#fff;cursor:pointer}
button.g{background:#e3edf8;color:var(--navy)}button.ok{background:var(--green)}button:disabled{opacity:.5}
.w{width:100%;margin-top:12px}.row{display:flex;gap:8px}.row>*{flex:1}
.hit{display:block;width:100%;text-align:left;background:#f4f7fb;color:var(--ink);margin-top:6px;font-weight:400}
.hit small{color:var(--mute);display:block}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--line)}
.kv.t{font-weight:700;color:var(--navy);border-bottom:2px solid var(--line)}
#msg{display:none;background:#fdecea;color:var(--bad);border-radius:8px;padding:10px;margin-bottom:10px}
#warn{display:none;background:#fff4d6;border:1px solid #e0b030;border-radius:8px;padding:10px;margin-top:12px}
.rc{background:#fff;border:2px solid var(--navy);border-radius:6px;padding:8px 10px;position:relative}
.rc img{width:100%;display:block;border-bottom:3px double var(--navy);padding-bottom:4px}
.rc h2{text-align:center;color:var(--navy);margin:8px 0;font-size:17px}
.rc table{width:100%;border-collapse:collapse;margin:8px 0}
.rc td,.rc th{border:1px solid var(--line);padding:1px 6px;font-size:13.5px;line-height:1.35}
.rc th{background:rgba(232,240,250,.75);color:var(--navy);text-align:left}.n{text-align:right;white-space:nowrap}
.tot td{font-weight:700;background:rgba(233,246,238,.75);color:var(--green)}
.sg{display:flex;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--mute)}.sg div{border-top:1px solid var(--line);padding-top:3px}
.tk{background:#eef2f6;color:var(--ink);border:2px solid var(--line)}.tk.on{background:var(--green);color:#fff;border-color:var(--green)}
.wmw{position:relative}.rc .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:auto;height:92%;max-width:92%;opacity:.15;border:0;pointer-events:none}.wmw table{position:relative}
.lb{font-size:.72em;color:var(--mute)}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:12px;border:1px solid currentColor}.st.Provisional{color:#b26a00;background:#fff4e0}.st.Final{color:#1a8a4a;background:#e6f5ec}.st.Cancelled{color:#667;background:#eee}.st.Pending{color:#c0271b;background:#fdecea}
.dr{padding:8px 0;border-top:1px solid var(--line)}.dr select{margin:4px 0}
.call{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;margin-left:8px;vertical-align:middle;text-decoration:none}
.rc .sn{width:46px;text-align:right}
.rc table{table-layout:fixed}.rc td.n,.rc th.n{width:96px}
.btn{display:block;text-align:center;font-weight:600;border-radius:8px;padding:10px 14px;background:var(--navy);color:#fff;text-decoration:none;flex:1}
textarea{width:100%;padding:10px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px}
.hide{display:none}
@media print{#sendbox{display:none!important}body{background:#fff}body *{visibility:hidden}#rcv,#rcv *{visibility:visible}#rcv{position:absolute;left:0;top:0;width:100%;border:1px solid #000;font-size:12px}#rcv img{max-height:22mm;width:auto;margin:0 auto}#rcv h2{margin:4px 0;font-size:15px}#rcv .wm{max-height:none;width:auto;height:92%;max-width:92%;margin:0}#rcv td,#rcv th{padding:2px 5px;font-size:12px}.noprint{display:none!important}}

<div id="s6" class="hide"><div class="box"><h1>What would you like to do?</h1><button class="w" onclick="svScr()">📋 Survey Form</button><button class="w" id="hAdm" onclick="admGo()">🎓 Admission Form</button><button class="w g" id="hRp" onclick="rpScr()" style="display:none">📊 Team / Person Report</button><div id="hn" style="font-size:13px;color:var(--bad);margin-top:8px"></div><button class="g w" onclick="goBack()">Back</button></div></div>

<div class="row"><div><label>Particular</label><select id="rpart"><option value="">Any</option><option value="adm">Admission/Registration Fee</option><option value="dev">Development Fund</option><option value="tui">Tuition Fee</option><option value="lib">Library</option><option value="gam">Games</option><option value="exa">Examination Fee</option><option value="wel">Student Welfare</option><option value="cul">Cultural Activity</option><option value="com">Computer</option><option value="lat">Late Fee/Fine</option><option value="old">Arrears / Old Due</option><option value="oth">Other</option><option value="bus">Bus / Transport</option></select></div><div><label>Status</label><select id="rstat"><option value="">All</option><option value="Active">Active</option><option value="Cancelled">Cancelled</option></select></div></div>

<div id="s9" class="hide"><div class="box"><h1>Message Templates</h1><p style="font-size:13px;color:var(--mute)">These texts are used for WhatsApp and SMS. Words in { } are filled in automatically. Staff can still edit a message before sending it.</p>

<div id="s5" class="hide"><div id="ab"></div><div id="vw" class="hide"></div><input type="file" id="fi" accept="image/*" class="hide"></div>
<div id="s4" class="hide"><div class="box"><h1>Dues List</h1><label>Class</label><select id="dc"></select><label>Section</label><div class="row" style="flex-wrap:wrap"><button type="button" id="ds_" class="tk on" onclick="setDSec('')">☑ All</button><button type="button" id="ds_A" class="tk" onclick="setDSec('A')">☐ A</button><button type="button" id="ds_B" class="tk" onclick="setDSec('B')">☐ B</button><button type="button" id="ds_C" class="tk" onclick="setDSec('C')">☐ C</button><button type="button" id="ds_D" class="tk" onclick="setDSec('D')">☐ D</button></div><input id="dsec" type="hidden" value=""><button class="w" onclick="loadDues()">Show List</button></div><div id="dl"></div><button class="g w" onclick="goBack()">Back</button></div>

<div id="rcv" class="rc"></div>
<div class="box noprint" style="margin-top:10px"><label>Parent WhatsApp Number</label><input id="wph" type="tel" inputmode="numeric" placeholder="10-digit mobile number"><div id="wnote" style="font-size:12px;margin-top:4px"></div><div id="wcall" style="margin-top:6px"></div><label>Paper size for printing</label><select id="pp" onchange="setPaper()"><option value="A5 portrait">A5 (receipt book size)</option><option value="A5 landscape">A5 landscape</option><option value="A4 portrait">A4</option></select></div>

<script>
/* ===== Fee System web page =====
   1) Deploy Code.gs as an Apps Script Web app (Execute as: Me, Access: Anyone).
   2) Paste its URL (ends with /exec) below.  3) Host this one file anywhere (Firebase Hosting, etc.). */
var API_URL=(function(){try{var u=localStorage.getItem('ris_fee_api');if(u)return u}catch(e){}return 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'})();
if(API_URL.indexOf('PASTE')===0){setTimeout(function(){var u=(prompt('First-time setup: paste the Apps Script web app address (it starts with https://script.google.com/macros/s/ and ends with /exec).')||'').trim();if(/^https:\/\/script\.google\.com\/macros\/s\/[^ ]+\/exec$/.test(u)){try{localStorage.setItem('ris_fee_api',u);location.reload()}catch(e){alert('This phone could not save the address.')}}else if(u){alert('That address is not correct. It must start with https://script.google.com/macros/s/ and end with /exec.')}},400)}
(function(){
 if(typeof google!=='undefined'&&google.script)return;
 if(API_URL.indexOf('PASTE')===0)document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.style.cssText='background:#fdecea;color:#b42318;border:1px solid #b42318;border-radius:8px;padding:10px;margin:10px;font:14px Arial';d.textContent='Setup needed: open this file and set API_URL to your Apps Script Web app URL.';document.body.insertBefore(d,document.body.firstChild)});
 function call(fn,a,ok,fail){
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a})})
   .then(function(r){return r.json()})
   .then(function(j){if(j.err)fail({message:j.err});else ok(j.ok)},
         function(e){fail({message:'Could not reach the server ('+e.message+'). Check the internet and the API_URL.'})});
 }
 function mk(ok,fail){return new Proxy({},{get:function(t,fn){return function(){call(fn,[].slice.call(arguments),ok,fail)}}})}
 window.google={script:{run:{withSuccessHandler:function(ok){return{withFailureHandler:function(fail){return mk(ok,fail)}}}}}};
})();
</script>

function svToAdm(){AO={name:SO.name,father:SO.father,mobile:SO.mobile,village:SO.village,cls:SO.cls,atype:SO.radYes==='Yes'?'Returning':'New',sibInfo:SO.sibInfo,relName:SO.relName,relRelation:SO.relRelation,relCls:SO.relCls,relStatus:SO.relStatus,relVillage:SO.relVillage,relParent:SO.relParent,relPhone:SO.relPhone,radAdm:SO.radAdm,radCls:SO.radCls,radYear:SO.radYear,radReason:SO.radReason,prevSchool:SO.prevSchool,prevCls:SO.prevCls,refType:SO.refType,refName:SO.refName,refNote:SO.refNote,heard:SO.heard,survey:SO.id};AD=[];AP=[];scr(5);drawForm()}

var SB=[],ALLS=[];
function sibLoad(){run('sibList',[U,P,cur.adm],function(a){SB=a;sibDraw()})}
function sibDraw(){var b=$('sibbox');if(!b)return;
 b.innerHTML=(SB.length?'<div style="color:#8a98a8;font-size:13px;margin-bottom:6px">👨‍👩‍👧 Siblings (in this school): '+SB.map(function(x){return esc(x.name)+' (Class '+esc(x.cls)+')'}).join(', ')+'</div>':'')+'<button type="button" class="g" style="padding:6px 12px;font-size:13px" onclick="sibOpen()">👨‍👩‍👧 Add / edit sibling</button><div id="sibp"></div>'}
function sibOpen(){busy(true);run('allStu',[U,P],function(a){busy(false);ALLS=a;sibShow('')})}
function sibShow(q){$('sibp').innerHTML='<div class="box" style="background:#f4f7fb;margin-top:8px"><input id="sibq" placeholder="Search by name / class / father name" value="'+esc(q)+'" oninput="sibFilter()"><div id="sibl"></div><button type="button" class="g w" onclick="$(\'sibp\').innerHTML=\'\'">Close</button></div>';sibFilter()}
function sibFilter(){var q=$('sibq').value.trim().toLowerCase(),lk={};SB.forEach(function(x){lk[x.adm]=1});
 var a=ALLS.filter(function(x){return x.adm!==cur.adm&&(!q||(x.name+' '+x.cls+' '+x.father+' '+x.adm).toLowerCase().indexOf(q)>-1)});
 $('sibl').innerHTML='<div style="font-size:12px;color:var(--mute);margin:6px 0">'+a.length+' students · tap to add / remove</div><div style="max-height:260px;overflow:auto">'+a.slice(0,150).map(function(x){return '<button type="button" class="hit" onclick="sibTap(\''+esc(x.adm)+'\')">'+(lk[x.adm]?'☑ ':'☐ ')+esc(x.name)+'<small>Class '+esc(x.cls)+' · Father: '+esc(x.father)+' · '+esc(x.adm)+'</small></button>'}).join('')+'</div>'}
function sibTap(o){var on=SB.some(function(x){return x.adm===o}),q=$('sibq').value;busy(true);run(on?'sibUnlink':'sibLink',[U,P,cur.adm,o],function(a){busy(false);SB=a;sibDraw();sibShow(q)})}
</script></body></html>
