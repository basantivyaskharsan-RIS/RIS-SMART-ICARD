<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>स्टाफ़ हाज़िरी</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e2e5ea;--p:#16a34a;--a:#dc2626;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b3;--bd:#2c333b;--p:#22c55e;--a:#f87171;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b3;--bd:#2c333b;--p:#22c55e;--a:#f87171;--ac:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mangal",sans-serif;font-size:16px}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
input[type=text]{flex:1}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 14px;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.nm{flex:1;overflow-wrap:anywhere}
.pa{width:46px;font-weight:700;padding:9px 0}
.pa.on.P{background:var(--p);border-color:var(--p);color:#fff}
.pa.on.A{background:var(--a);border-color:var(--a);color:#fff}
.x{border:0;color:var(--mu);padding:6px 8px;background:none}
.sum{display:flex;gap:14px;font-weight:600;margin-bottom:8px}
.sum .p{color:var(--p)}.sum .a{color:var(--a)}
.mu{color:var(--mu);font-size:14px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
#note{display:none;background:#fef3c7;color:#78350f;padding:8px 10px;border-radius:8px;margin-bottom:12px;font-size:14px}
</style></head><body><div class="w">
<h1>📋 स्टाफ़ हाज़िरी (P / A)</h1>
<div id="note">डेटा सेव नहीं हो रहा। पेज बंद करने पर हाज़िरी मिट जाएगी।</div>

<div class="card">
 <div class="bar"><label for="d">तारीख:</label><input type="date" id="d"></div>
</div>

<div class="card">
 <div class="sum"><span class="p">उपस्थित (P): <b id="cp">0</b></span><span class="a">अनुपस्थित (A): <b id="ca">0</b></span></div>
 <div id="list"></div>
 <div class="mu" id="empty" style="display:none">पहले नीचे से स्टाफ़ का नाम जोड़ें।</div>
 <div class="bar" style="margin-top:10px"><button id="allp">सब P करें</button></div>
</div>

<div class="card">
 <div class="bar"><input type="text" id="nn" placeholder="नया स्टाफ़ का नाम"><button class="pri" id="add">जोड़ें</button></div>
</div>

<div class="card">
 <div class="bar" style="margin-bottom:8px"><b>महीने का सार</b><input type="month" id="mo"></div>
 <div class="sc"><table id="tb"></table></div>
</div>
</div>
<script>
(function(){
var staff=[],att={},db=null,loaded=false;
var $=function(i){return document.getElementById(i)};
function ymd(d){var z=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
var today=ymd(new Date());
$("d").value=today;$("mo").value=today.slice(0,7);

function save(kind,date){
  if(!db){return}
  try{
    if(kind==="staff"){db.doc("meta/staff").set({list:staff}).catch(function(){})}
    else{db.doc("att/"+date).set({m:att[date]||{}}).catch(function(){})}
  }catch(e){}
}
function render(){
  var date=$("d").value,m=att[date]||{},L=$("list");
  L.textContent="";
  $("empty").style.display=staff.length?"none":"block";
  var p=0,a=0;
  staff.forEach(function(s){
    var r=document.createElement("div");r.className="row";
    var n=document.createElement("div");n.className="nm";n.textContent=s.name;r.appendChild(n);
    ["P","A"].forEach(function(v){
      var b=document.createElement("button");b.className="pa "+v+(m[s.id]===v?" on":"");b.textContent=v;
      b.onclick=function(){mark(s.id,m[s.id]===v?null:v)};r.appendChild(b);
    });
    var x=document.createElement("button");x.className="x";x.textContent="✕";x.title="हटाएँ";
    x.onclick=function(){if(confirm(s.name+" को सूची से हटाएँ?")){staff=staff.filter(function(t){return t.id!==s.id});save("staff");render();summary()}};
    r.appendChild(x);L.appendChild(r);
    if(m[s.id]==="P")p++;if(m[s.id]==="A")a++;
  });
  $("cp").textContent=p;$("ca").textContent=a;
}
function mark(id,v){
  var date=$("d").value;att[date]=att[date]||{};
  if(v)att[date][id]=v;else delete att[date][id];
  save("att",date);render();summary();
}
function summary(){
  var mo=$("mo").value,T=$("tb");T.textContent="";
  var h=document.createElement("tr");
  ["नाम","P","A"].forEach(function(t){var c=document.createElement("th");c.textContent=t;h.appendChild(c)});T.appendChild(h);
  staff.forEach(function(s){
    var p=0,a=0;
    Object.keys(att).forEach(function(d){if(d.indexOf(mo)===0){var v=(att[d]||{})[s.id];if(v==="P")p++;if(v==="A")a++}});
    var r=document.createElement("tr");
    [s.name,p,a].forEach(function(t){var c=document.createElement("td");c.textContent=t;r.appendChild(c)});T.appendChild(r);
  });
}
$("d").onchange=render;$("mo").onchange=summary;
$("add").onclick=function(){
  var v=$("nn").value.trim();if(!v)return;
  staff.push({id:"s"+Date.now().toString(36),name:v});$("nn").value="";
  save("staff");render();summary();
};
$("nn").onkeydown=function(e){if(e.key==="Enter")$("add").click()};
$("allp").onclick=function(){
  var date=$("d").value;att[date]={};staff.forEach(function(s){att[date][s.id]="P"});
  save("att",date);render();summary();
};
render();summary();

var t=setTimeout(function(){if(!db)$("note").style.display="block"},10000);
if(window.claude&&claude.use){
  claude.use("db").then(function(d){
    if(!d){$("note").style.display="block";return}
    db=d;clearTimeout(t);$("note").style.display="none";
    db.doc("meta/staff").onSnapshot(function(s){staff=(s.exists&&s.data().list)||[];render();summary()});
    db.collection("att").onSnapshot(function(q){
      att={};q.docs.forEach(function(x){att[x.id]=(x.data()||{}).m||{}});render();summary();
    });
  }).catch(function(){$("note").style.display="block"});
}else{$("note").style.display="block"}
})();
</script></body></html>
