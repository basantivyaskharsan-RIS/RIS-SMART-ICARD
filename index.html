          delete: async function () { try { await ackW(FS.deleteDoc(dref(p))); } catch (e) { throw wrapErr(e); } },
          onSnapshot: function (cb, eb) {
            return FS.onSnapshot(dref(p), function (s) { cb(snapDoc(s)); }, function (e) { if (eb) eb(wrapErr(e)); });
          }
        };
      },
      query: async function (c, o) {
        o = o || {};
        const cs = [];
        (o.where || []).forEach(function (w) { cs.push(FS.where(w[0], w[1], w[2])); });
        if (o.order) cs.push(FS.orderBy(o.order[0], o.order[1] || 'asc'));
        if (o.limit) cs.push(FS.limit(o.limit));
        try {
          const s = await FS.getDocs(FS.query(FS.collection(fs, c), ...cs));
          return s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; });
        } catch (e) { throw wrapErr(e); }
      },
      collectionIn: function (c, field, vals) {
        return {
          onSnapshot: function (cb, eb) {
            return FS.onSnapshot(FS.query(FS.collection(fs, c), FS.where(field, 'in', vals)), function (s) {
              cb({ docs: s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }) });
            }, function (e) { if (eb) eb(wrapErr(e)); });
          }
        };
      },
      collection: function (c) {
        return {
          onSnapshot: function (cb, eb) {
            return FS.onSnapshot(FS.collection(fs, c), function (s) {
              cb({ docs: s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }) });
            }, function (e) { if (eb) eb(wrapErr(e)); });
          }
        };
      }
    };
    const au = {
      signIn: async function (e, p) { try { return await AU.signInWithEmailAndPassword(auth, e, p); } catch (x) { throw wrapErr(x); } },
      signUp: async function (e, p) { try { return await AU.createUserWithEmailAndPassword(auth, e, p); } catch (x) { throw wrapErr(x); } },
      signOut: function () { return AU.signOut(auth); },
      changePw: async function (p) { try { await AU.updatePassword(auth.currentUser, p); } catch (x) { throw wrapErr(x); } },
      reset: async function (e) { try { await AU.sendPasswordResetEmail(auth, e); } catch (x) { throw wrapErr(x); } },
      onChange: function (cb) { return AU.onAuthStateChanged(auth, cb); },
      /* create another person's login without signing the admin out (uses a second, temporary app) */
      createAccount: async function (e, p) {
        const name = 'sec' + Date.now();
        const a2 = A.initializeApp(cfg, name);
        try {
          const g = AU.getAuth(a2);
          await AU.createUserWithEmailAndPassword(g, e, p);
          await AU.signOut(g);
        } catch (x) { throw wrapErr(x); }
        finally { try { await A.deleteApp(a2); } catch (z) {} }
      }
    };
    window.__fbRes({ db: db, auth: au, cfg: cfg });
  }
} catch (e) {
  window.__fbRes({ error: 'load', message: String((e && e.message) || e) });
}

const CR={img:null,z:1,ox:0,oy:0,st:null,size:280};
function openCropper(st,file){if(!file)return;const url=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{CR.img=im;CR.z=1;CR.ox=0;CR.oy=0;CR.st=st;showCropper();URL.revokeObjectURL(url)};im.onerror=()=>toast('This photo could not be opened, choose another.');im.src=url}
function cropDraw(cv,size){const im=CR.img,k=size/CR.size,base=Math.max(CR.size/im.width,CR.size/im.height)*CR.z,w=im.width*base,h=im.height*base;
 const maxx=(w-CR.size)/2,maxy=(h-CR.size)/2;CR.ox=Math.max(-maxx,Math.min(maxx,CR.ox));CR.oy=Math.max(-maxy,Math.min(maxy,CR.oy));
 const c=cv.getContext('2d');cv.width=size;cv.height=size;c.fillStyle='#fff';c.fillRect(0,0,size,size);c.drawImage(im,((CR.size-w)/2+CR.ox)*k,((CR.size-h)/2+CR.oy)*k,w*k,h*k)}
function showCropper(){const st=CR.st;const sh=$('#sheet');sh.hidden=false;sh.innerHTML=`<div><h2>${esc(st.name)} — Photo</h2><p class="muted small">Drag with your finger and zoom with the slider below. Keep the face in the centre.</p>

<input type="range" id="zm" min="1" max="4" step="0.01" value="1" style="width:100%;margin-block:10px">
<div class="row"><button class="btn sec grow" id="cc">Cancel</button><button class="btn grow" id="cs">Save photo</button></div></div>`;
 const cv=$('#crop');const draw=()=>cropDraw(cv,280);draw();let drag=null;
 cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:CR.ox,oy:CR.oy};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!drag)return;CR.ox=drag.ox+(e.clientX-drag.x);CR.oy=drag.oy+(e.clientY-drag.y);draw()};
 cv.onpointerup=cv.onpointercancel=()=>drag=null;
 $('#zm').oninput=e=>{CR.z=parseFloat(e.target.value);draw()};

function copyText(t){const done=()=>toast('Copied ✔');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fb())}else fb()}catch(e){fb()}
 function fb(){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Could not copy — press and hold the text to select and copy.')}a.remove()}}
const rnd=(n,al)=>{const a=new Uint32Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*4294967296)}let s='';for(let i=0;i<n;i++)s+=al[a[i]%al.length];return s};

// ---- deliver a finished file: save it, or share it (WhatsApp etc.) through the phone's share sheet.
// Sharing needs a fresh tap (browsers refuse it after a long wait), so it is offered as a button once the file is ready.
function deliver(filename,blob){return new Promise(res=>{const type=blob.type||(/\.pdf$/i.test(filename)?'application/pdf':/\.zip$/i.test(filename)?'application/zip':/\.png$/i.test(filename)?'image/png':'application/octet-stream');
 const file=new File([blob],filename,{type});let canShare=false;try{canShare=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 const d=$('#dlg');d.hidden=false;
 d.innerHTML=`<div><b>File ready ✔</b><p class="small" style="margin:6px 0 10px;overflow-wrap:anywhere">${esc(filename)} · ${(blob.size/1048576).toFixed(1)} MB</p>
<div class="row"><button class="btn grow" id="dv_wa" style="background:#1f9d55">📲 WhatsApp</button><button class="btn grow" id="dv_em" style="background:#1d56b0">✉ Email</button></div>
<div class="row" style="margin-top:6px"><button class="btn sec grow" id="dv_sv">💾 Save</button>${canShare?'<button class="btn sec grow" id="dv_sh">↗ Other apps</button>':''}</div>
<p class="muted small" style="margin:8px 0 0">${canShare?'WhatsApp / Email open your phone\'s share list with this file attached — choose WhatsApp or Gmail there.':'This phone cannot attach files directly: the file is saved first, then WhatsApp / Email opens — attach the saved file there.'}</p>
<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sec" id="dv_x">Close</button></div></div>`;
 const close=()=>{unbusy();res()};$('#dv_x').onclick=close;
 $('#dv_sv').onclick=async()=>{await dl(filename,blob);close()};
 const send=async(kind)=>{const title=filename.replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' '),text='Radiant International School, Kharsan — '+title;
  if(canShare){try{await navigator.share({files:[file],title,text});close();return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await dl(filename,blob)}catch(e){}
  toast('File saved. Now attach it in '+(kind==='wa'?'WhatsApp':'the email')+'.',6000);
  setTimeout(()=>{try{location.href=kind==='wa'?'https://wa.me/?text='+encodeURIComponent(text):'mailto:?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent(text+'\n\n(Please attach the saved file: '+filename+')')}catch(e){}},900);close()};
 $('#dv_wa').onclick=()=>send('wa');$('#dv_em').onclick=()=>send('em');
 if(canShare)$('#dv_sh').onclick=()=>send('other')})}

// SHA-256 (WebCrypto when available, plain JS fallback)
function sha256js(str){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const bytes=Array.from(new TextEncoder().encode(str)),bitLen=bytes.length*8;
 bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
 const hi=Math.floor(bitLen/4294967296),lo=bitLen>>>0;[hi,lo].forEach(v=>{for(let i=3;i>=0;i--)bytes.push((v>>>(i*8))&255)});
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],w=new Array(64);
 const R=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<bytes.length;o+=64){
  for(let i=0;i<16;i++)w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
  for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function sha(s){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256js(s)}

function authMsg(e){const c=e&&e.code;
 if(c==='invalid_credential'||c==='wrong_password'||c==='user_not_found'||c==='invalid_login_credentials')return'Wrong password (or e-mail).';
 if(c==='invalid_email')return'This e-mail address is not valid.';
 if(c==='too_many_requests')return'Too many attempts. Wait a few minutes and try again.';
 if(c==='network_request_failed')return'Network problem. Check the internet and try again.';
 if(c==='weak_password')return'Password is too weak — use at least '+MINPW+' letters/digits.';
 if(c==='email_already_in_use')return'This e-mail already has an account.';
 if(c==='requires_recent_login')return'For safety, log out, log in again and then change the password.';
 if(c==='operation_not_allowed')return'Email/Password sign-in is not switched on in Firebase (Authentication → Sign-in method).';
 if(c==='user_disabled')return'This account has been disabled.';
 return'Login problem ('+(c||'error')+'). Try again.'}

const heroHTML=()=>`<div class="hero"><img src="${HERO}" alt=""><div class="lgw"><img src="${LOGO}" alt=""><span>Welcome · ID Card &amp; Student Records</span></div></div>`;
function viewLogin(){const v=$('#view');
 if(!S.loginLoaded){v.innerHTML='<p class="muted">Loading…</p>';return}
 if(L.mode==='forgot')return viewForgot();
 if(!S.login.admin)return viewFirstRun();
 const names=Object.entries(S.login).filter(([id,s])=>s.cat===L.cat&&id!=='admin').sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name)));
 const isAdm=L.cat==='admin';
 v.innerHTML=`${heroHTML()}<div class="box" style="margin-top:14px"><h2>Login</h2>
<label class="f">1. Choose category</label><select id="l_cat"><option value="">— Select —</option>${CATS.map(c=>`<option value="${c[0]}" ${L.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
${isAdm?`<label class="f">2. Admin e-mail</label><input type="email" id="l_em" autocomplete="username" autocapitalize="off" value="${esc(lastAdminEmail())}">${pwField('l_pw','3. Password')}${showRow}<div class="row" style="margin-top:12px"><button class="btn grow" id="l_go">Login</button></div><p class="small" style="margin:10px 0 0"><a href="#" id="l_forgot">Forgot password?</a></p>`
 :(L.cat?(names.length?`<label class="f">2. Choose your name</label><select id="l_sid"><option value="">— Select —</option>${names.map(([id,s])=>`<option value="${esc(id)}" ${L.sid===id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:'<p class="warn" style="margin:12px 0 0"><b>No staff available in this category.</b></p>'):'')}
${!isAdm&&L.sid&&S.login[L.sid]?`${pwField('l_pw','3. Password')}${showRow}<div class="row" style="margin-top:12px"><button class="btn grow" id="l_go">Login</button></div><p class="small" style="margin:10px 0 0"><a href="#" id="l_forgot">Forgot password?</a></p>`:''}
<p class="muted small" style="margin:14px 0 0">Hindi digits (१२३) and extra spaces in the password are corrected automatically.</p></div>`;
 $('#l_cat').onchange=e=>{L.cat=e.target.value;L.sid='';const l=Object.entries(S.login).filter(([id,s])=>s.cat===L.cat&&id!=='admin');if(L.cat!=='admin'&&l.length===1)L.sid=l[0][0];viewLogin()};
 const sl=$('#l_sid');if(sl)sl.onchange=e=>{L.sid=e.target.value;viewLogin()};
 bindShow();
 if($('#l_go')){$('#l_go').onclick=doLogin;$('#l_pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#l_forgot').onclick=e=>{e.preventDefault();L.mode='forgot';viewLogin()}}}

async function doLogin(){const pw=normPw($('#l_pw').value);if(!pw)return toast('Enter the password.');
 let email;
 if(L.cat==='admin'){email=$('#l_em').value.trim().toLowerCase();if(!email)return toast('Enter the admin e-mail.')}
 else{const s=S.login[L.sid];if(!s||!s.ae)return;email=s.ae}
 const b=$('#l_go');b.disabled=true;
 try{await FB.auth.signIn(email,pw)}catch(e){b.disabled=false;toast(authMsg(e),6000);return}
 if(L.cat==='admin'){try{localStorage.setItem('ris_admin_email',email)}catch(e){}}
 S.lastPw=pw;
 const ok=await afterSignIn(email);if(!ok){const bb=$('#l_go');if(bb)bb.disabled=false}}

// after a successful sign-in (or when an old session is found): load this person's staff record and enter the app
async function afterSignIn(email){
 const fake=isFakeEmail(email);let sid=fake?sidFromEmail(email):'admin',d=null,adm2=false;
 try{const sn=await S.db.doc('staff/'+sid).get();d=sn.exists?sn.data():null}catch(e){}
 if(!fake&&(!d||String(d.ae||'').toLowerCase()!==String(email).toLowerCase())){try{const sn=await S.db.doc('admins/'+String(email).toLowerCase()).get();if(sn.exists){d=Object.assign({cat:'admin',classes:[],ae:String(email).toLowerCase()},sn.data());sid='adm_'+hash(String(email).toLowerCase()).toString(36);adm2=true}}catch(e){}}
 if(!d||String(d.ae||'').toLowerCase()!==String(email).toLowerCase()||(d.off&&d.off.b)){try{await FB.auth.signOut()}catch(e){}
  S.me=null;toast('This login is not active any more. Please ask the admin.',6000);renderAll(true);return false}
 S.me={id:sid,name:d.name,cat:d.cat,classes:d.classes||[],temp:!!d.temp,mobile:d.mobile||'',adm2,email:String(email).toLowerCase()};S.isOwner=sid==='admin'||adm2;
 if(d.temp){viewChangePw(true);return true}
 enterApp();return true}

function viewFirstRun(){const v=$('#view');
 v.innerHTML=`<div class="box" style="margin-top:14px"><h2>First time — create the admin login</h2><p class="muted small">Do this yourself, right now, on your own phone. After it is done, staff can be added. Use a real e-mail address that you can open — it is used if you ever forget the password.</p>
<label class="f">Admin name</label><input type="text" id="f_name" value="Admin"><label class="f">Admin e-mail</label><input type="email" id="f_em" autocapitalize="off" autocomplete="username" value="${esc(lastAdminEmail())}">${pwField('f_p1','New password (at least '+MINPW+' letters/digits)')}${pwField('f_p2','Re-enter password')}${showRow}
<div class="row" style="margin-top:12px"><button class="btn grow" id="f_go">Create admin login</button></div></div>`;
 bindShow();
 $('#f_go').onclick=async()=>{const nm=$('#f_name').value.trim()||'Admin',em=$('#f_em').value.trim().toLowerCase(),p1=normPw($('#f_p1').value),p2=normPw($('#f_p2').value);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||isFakeEmail(em))return toast('Enter your real e-mail address.');
  if(p1.length<MINPW)return toast('Password must be at least '+MINPW+' letters/digits.');if(p1!==p2)return toast('The two passwords do not match.');
  $('#f_go').disabled=true;
  try{try{await FB.auth.signUp(em,p1)}catch(e){if(e&&e.code==='email_already_in_use'){await FB.auth.signIn(em,p1)}else throw e}
   const d={name:nm,cat:'admin',classes:[],ae:em,at:Date.now()};
   await S.db.doc('staff/admin').set(d);await S.db.doc('login/admin').set({name:nm,cat:'admin'});
   try{localStorage.setItem('ris_admin_email',em)}catch(e){}
   S.staff.admin=d;S.login.admin={name:nm,cat:'admin'};S.me={id:'admin',name:nm,cat:'admin',classes:[]};S.isOwner=true;enterApp()}
  catch(e){$('#f_go').disabled=false;toast(e&&e.fcode&&/^auth\//.test(e.fcode)?authMsg(e):errMsg(e),7000)}}}

// change password: forced (temporary password) or voluntary
function viewChangePw(forced){const v=$('#view');S.hold=true;$('#tabs').hidden=true;renderTop();
 v.innerHTML=`<div class="box" style="margin-top:14px"><h2>${forced?'Create new password':'Change password'}</h2>${forced?'<p class="muted small">Your password is temporary. Create your own password before continuing.</p>':''}${pwField('c_p1','New password (at least '+MINPW+' letters/digits)')}${pwField('c_p2','Re-enter password')}${showRow}
<div class="row" style="margin-top:12px">${forced?'':'<button class="btn sec grow" id="c_no">Cancel</button>'}<button class="btn grow" id="c_go">Save</button></div></div>`;bindShow();
 if(!forced)$('#c_no').onclick=()=>{S.hold=false;renderAll(true)};
 $('#c_go').onclick=async()=>{const p1=normPw($('#c_p1').value),p2=normPw($('#c_p2').value);
  if(p1.length<MINPW)return toast('Password must be at least '+MINPW+' letters/digits.');if(p1!==p2)return toast('The two passwords do not match.');
  if(forced&&S.lastPw&&p1===S.lastPw)return toast('You cannot keep the temporary password itself — choose a new password.');
  $('#c_go').disabled=true;
  try{await FB.auth.changePw(p1);
   try{await S.db.doc(S.me.adm2?'admins/'+S.me.email:'staff/'+S.me.id).update({temp:false,pwAt:Date.now()});if(S.staff[S.me.id])S.staff[S.me.id].temp=false}catch(e){}
   S.me.temp=false;S.lastPw=null;S.hold=false;toast('Password saved ✔');enterApp()}
  catch(e){$('#c_go').disabled=false;toast(e&&e.fcode&&/^auth\//.test(e.fcode)?authMsg(e):errMsg(e),7000)}}}

function viewForgot(){const v=$('#view');
 if(L.cat==='admin'){
  v.innerHTML=`<div class="box" style="margin-top:14px"><h2>Forgot admin password</h2><p class="muted small">Enter the admin e-mail. Firebase will send a link to that address; open the link and choose a new password.</p>
<label class="f">Admin e-mail</label><input type="email" id="g_em" autocapitalize="off" value="${esc(lastAdminEmail())}"><div class="row" style="margin-top:12px"><button class="btn sec grow" id="g_no">Back</button><button class="btn grow" id="g_go">Send reset link</button></div></div>`;
  $('#g_no').onclick=()=>{L.mode='login';viewLogin()};
  $('#g_go').onclick=async()=>{const em=$('#g_em').value.trim().toLowerCase();if(!em)return toast('Enter the e-mail.');$('#g_go').disabled=true;
   try{await FB.auth.reset(em);toast('If this e-mail is registered, a reset link has been sent. Check your inbox and spam.',7000)}catch(e){toast(authMsg(e),6000)}$('#g_go').disabled=false}
  return}
 const s=S.login[L.sid];
 v.innerHTML=`<div class="box" style="margin-top:14px"><h2>Forgot password</h2><p>${s?esc(s.name)+' — ':''}Please ask the admin to <b>reset your password</b>. The admin will send you a new temporary password on WhatsApp.</p><button class="btn sec" id="g_no">Back</button></div>`;
 $('#g_no').onclick=()=>{L.mode='login';viewLogin()}}

// ---- entering / leaving the app
function enterApp(){S.hold=false;L.mode='login';S.tab=tabsFor()[0][0];subAll();S.ready=true;renderAll(true);renderBars()}
function topLogout(){if(isAdmin()&&allStudents().length){choose('Would you like to back up your data before logging out?',[{t:'Back up and log out',f:async()=>{await doBackup(false);doLogout()}},{t:'Without backup',c:'sec',f:doLogout},{t:'Cancel',c:'sec'}])}else doLogout()}
function doLogout(){try{if(FB)FB.auth.signOut()}catch(e){}S.isOwner=false;clearData();S.me=null;L.cat='';L.sid='';L.mode='login';S.ready=false;S.hold=false;renderAll(true);renderBars()}
function renderTop(){const t=$('#topBtns');if(!t)return;if(!S.me){t.innerHTML='';return}
 t.innerHTML=`<span class="chip ok" title="${esc(S.me.name)}">${esc(S.me.name)} · ${esc(catLabel(S.me.cat))}</span><button id="tbSrch" title="Search">🔍</button>${isAdmin()?'<button id="tbSet" title="Settings">⚙</button>':''}<button id="tbPw" title="Change password">🔑</button><button id="tbOut" title="Log out">⎋<span class="lbl"> Log out</span></button>`;
 $('#tbSrch').onclick=globalSearch;$('#tbPw').onclick=()=>viewChangePw(false);if($('#tbSet'))$('#tbSet').onclick=()=>{S.hold=false;S.tab='settings';renderAll(true)};$('#tbOut').onclick=topLogout}

// ================= Student data writes =================

async function writeClass(doc){const json=JSON.stringify(doc);const sz=new Blob([json]).size;
 // Firestore's real limit is 1 MiB per document; keep a safety margin. (Old app limit of 245 KB blocked big classes.)
 if(sz>900000)throw{code:'invalid_argument',message:'Class "'+doc.name+'" is '+Math.round(sz/1024)+' KB (limit about 900 KB). Split it into sections first.'};
 doc=JSON.parse(json); // drops undefined values that Firestore rejects
 await save(()=>S.db.doc('classes/'+classKey(doc.name)).set(doc))}

// ================= Common delete safety: Undo button + Trash (nothing is erased at once) =================
function undoToast(msg,fn,ms){const t=$('#toast');t.innerHTML=`<div style="pointer-events:auto">${esc(msg)} <button class="btn sm" id="ut_b" style="margin-left:10px">↩ Undo</button></div>`;let used=false;
 $('#ut_b').onclick=async()=>{if(used)return;used=true;const b=$('#ut_b');if(b)b.disabled=true;try{await fn();t.innerHTML='';toast('Restored ✔',2500)}catch(e){t.innerHTML='';toast(e&&e.message&&!e.code?e.message:errMsg(e),6000)}};
 clearTimeout(toast.t);toast.t=setTimeout(()=>{if(t.querySelector('#ut_b'))t.innerHTML=''},ms||8000)}
const DELBUSY=new Set();
// delUndo({kind,label,items:[path,...],cache:[[bucket,key],...],after})  main item first; copies to trash, then deletes
async function delUndo(o){const key=o.items[0];if(DELBUSY.has(key))return;DELBUSY.add(key);
 try{const items=[];for(const path of o.items){const sn=await S.db.doc(path).get();if(sn.exists)items.push({path,data:sn.data()})}
  if(!items.length)throw{message:'Nothing to delete (already removed).'};
  const id=cleanId('t_'+Date.now().toString(36)+'_'+key.replace(/[^A-Za-z0-9]/g,'').slice(-12)),td={kind:o.kind,label:o.label,items,cache:(o.cache||[]).map(x=>Array.isArray(x)?x.join('|'):x),by:S.me.id,byName:S.me.name||'',at:Date.now()};
  try{await enqueue(()=>S.db.doc('trash/'+id).set(td))}catch(e){if(!(e&&e.code==='invalid_argument'))throw e;td.items=items.map(it=>({path:it.path,dj:JSON.stringify(it.data)}));await enqueue(()=>S.db.doc('trash/'+id).set(td))} // Firestore refuses nested arrays: fall back to JSON text
  for(const it of items)await enqueue(()=>S.db.doc(it.path).delete());
  (o.cache||[]).forEach(([b,k])=>{if(S[b])delete S[b][k]});
  logHist('delete',{},o.kind+': '+o.label+' (kept in Trash)');
  if(o.after)o.after();
  undoToast('Deleted: '+o.label,()=>trashRestore(id),8000)}
 finally{DELBUSY.delete(key)}}
async function trashRestore(id){const sn=await S.db.doc('trash/'+id).get();if(!sn.exists)throw{message:'Already restored or removed.'};const td=sn.data();
 td.items.forEach(it=>{if(it.data===undefined&&it.dj)it.data=JSON.parse(it.dj)});
 for(const it of td.items){const ex=await S.db.doc(it.path).get();if(!ex.exists)await enqueue(()=>S.db.doc(it.path).set(it.data))}
 (td.cache||[]).map(x=>Array.isArray(x)?x:String(x).split('|')).forEach(([b,k])=>{const it=td.items[0];if(S[b]&&it&&it.path.endsWith('/'+k))S[b][k]=it.data});
 await enqueue(()=>S.db.doc('trash/'+id).delete());logHist('restore',{},td.kind+': '+td.label+' (restored from Trash)');renderAll(true)}

async function moveMany(moves){const cur={};const get=(k,name)=>cur[k]||(cur[k]=cdoc(S.classes[k]||{name},{students:[...((S.classes[k]||{}).students||[])]}));
 moves.forEach(({st,cls})=>{const nk=classKey(cls);const oc=get(st.ckey,splitClass(st.cls)[0]);oc.students=oc.students.filter(x=>x.id!==st.id);
  const nc=get(nk,cls);nc.students=nc.students.filter(x=>x.id!==st.id);nc.students.push(pack(Object.assign({},st,{seat:st.seat===cls?'':st.seat})))});
 const keys=Object.keys(cur);busy('Saving…');
 try{if(moves.length>=5)await autoBak(keys,'Move '+moves.length+' students');for(let i=0;i<keys.length;i++){busyP(`${i+1} / ${keys.length}`,i/keys.length);const d=cur[keys[i]];d.ok=false;d.okAt=0;await writeClass(d);S.classes[keys[i]]=d}
  for(const {st,cls} of moves){if(S.thumbs[st.id]){await save(()=>S.db.doc('thumbs/'+st.id).update({cls})).catch(()=>{});await save(()=>S.db.doc('photos/'+st.id).update({cls})).catch(()=>{});S.thumbs[st.id]=Object.assign({},S.thumbs[st.id],{cls})}}
  unbusy();refresh()}catch(e){unbusy();throw e}}

function gate(cn,fn){DP.compute();const rs=redIds();const l=listFor(cn);const n=l.filter(s=>rs.has(s.id)).length;

 if(!cs.length){v.innerHTML='<div class="box"><p class="muted">No classes yet. Add students from Excel in "Settings".</p></div>';return}
 const allOk=cs.every(c=>!(c.students||[]).length||(c.ok&&!lateOf(c)));
 v.innerHTML='<h2>Class-wise check and print</h2><p class="muted small">Steps: 1) Get all photos added → 2) Check every card with "Check PDF" → 3) Tap "Check complete (OK)" → 4) Create the "Print sheet PDF". The OK mark is removed as soon as the class data/photo/RTE/floor-room changes.</p><div class="box"><label class="f" style="margin-top:0">How should cards be arranged on the A4 print sheet</label><select id="lay"><option value="9" '+(S.layout==='10'?'':'selected')+'>9 cards (upright, 3 × 3) — safe, more space at the edges</option><option value="10" '+(S.layout==='10'?'selected':'')+'>10 cards (rotated, 2 × 5) — very little margin at top and bottom</option></select><p class="muted small" style="margin:6px 0 0">10 cards option, the first and last cards stay about 5 mm from the paper edge. Some printers may cut off the edge, so print one page first and check.</p></div>'
 +`<div class="box"><b>All classes together</b><div class="row" style="margin-top:8px"><button class="btn sec sm" data-a="prvall">👁 Print preview (all)</button><button class="btn sec sm" data-a="chkall">Check PDF (all)</button><button class="btn sec sm" data-a="prnall" ${allOk?'':'disabled'}>Print sheet PDF (all)</button></div><p class="muted small" style="margin:6px 0 0">${allOk?'All classes are OK.':'A print sheet for all classes can be made only when every class is OK.'} This is a very big job — better to do it class by class on mobile.</p></div>`
 +cs.map(c=>{const st=(c.students||[]).filter(s=>!s.left);const wp=st.filter(s=>hasThumb(s.id)).length;const late=lateOf(c);const k=classKey(c.name);const e=effInfo(k);const seated=allStudents().filter(s=>s.seat===c.name&&s.cls!==c.name).length;

<p class="small muted" style="margin:6px 0">${st.length} student(s) · photos ${wp}/${st.length}${wp<st.length?` · <span class="warn">${st.length-wp} without photo</span>`:''}${seated?` · Seated here from other classes: ${seated}`:''}</p><div class="bar"><i style="width:${st.length?wp/st.length*100:0}%"></i></div>
${adm?`<div class="row" style="margin-top:10px;align-items:flex-end"><div style="flex:1 1 140px"><label class="f" style="margin:0 0 2px">Floor</label><select id="fl_${k}"><option value="">—</option>${[...new Set([...FLOORS,e.floor].filter(Boolean))].map(x=>`<option ${x===e.floor?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div style="flex:1 1 90px"><label class="f" style="margin:0 0 2px">Room number</label><input type="text" id="rm_${k}" value="${esc(e.room)}"></div><button class="btn sec sm" data-a="fr" data-k="${k}">Save floor/room</button></div>`:`<p class="small" style="margin:8px 0 0">${e.floor||e.room?`${esc(e.floor)} ${e.room?'· Room '+esc(e.room):''}`:'<span class="muted">Floor/room not filled yet</span>'}</p>`}
<div class="row" style="margin-top:10px"><button class="btn sec sm" data-a="chk" data-k="${k}">Check PDF</button>${adm?`<button class="btn sm" data-a="ok" data-k="${k}">${c.ok&&!late?'Remove OK':'Check complete (OK)'}</button>`:''}<button class="btn sec sm" data-a="prv" data-k="${k}">👁 Print preview</button><button class="btn sec sm" data-a="prn" data-k="${k}" ${c.ok&&!late?'':'disabled'}>Print sheet PDF</button><button class="btn sec sm" data-a="zip" data-k="${k}">PNG ZIP</button></div>${c.ok&&!late?'':'<p class="muted small" style="margin:6px 0 0">Print sheet can be created only when the check is OK.</p>'}</div>`}).join('');

   nowOk&&(c.students||[]).some(s=>!s.left&&!hasThumb(s.id))?ask('Some children have no photo. Mark OK anyway?',go,'Yes, OK'):go()}}}

async function mkTablePdf(title,H,rows){busy('Creating PDF…');

 const m=10,tw=W-2*m;const wts=H.map((h,i)=>i===0?4:Math.max(8,Math.min(26,Math.max(String(h).length,...rows.slice(0,60).map(r=>String(r[i]||'').length)))));const sum=wts.reduce((a,b)=>a+b,0),cw=wts.map(x=>x/sum*tw);

ectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}\nfunction dbAll(){return new Promise(res=>{try{const q=idb.transaction('p').objectStore('p').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}\nfunction dbPut(o){return new Promise(res=>{try{const t=idb.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}\nfunction dbDel(id){return new Promise(res=>{try{const t=idb.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}\n// ---- list\nconst stu=D.students;\nfunction counts(){const mine=stu.filter(s=>!s.has);const done=mine.filter(s=>photos[s.id]).length;return{total:mine.length,done}}\nfunction render(){const q=$('#q').value.trim().toLowerCase(),pend=$('#pend').checked;const c=counts();\n $('#h1').textContent=D.school;$('#sub').textContent='Photo collection — '+D.teacher+(D.classes.length?' · '+D.classes.join(', '):'');\n $('#cnt').textContent=c.done+' of '+c.total+' photos done'+(stu.length-c.total?' ('+(stu.length-c.total)+' already have a photo in the app)':'');\n $('#pb').style.width=(c.total?c.done/c.total*100:0)+'%';$('#send').textContent='Send photos to admin ('+c.done+')';$('#send').disabled=!c.done;\n let a=stu.filter(s=>!q||[s.name,s.id,s.roll,s.father,s.cls].some(x=>String(x||'').toLowerCase().includes(q)));\n if(pend)a=a.filter(s=>!s.has&&!photos[s.id]);\n const g={};a.forEach(s=>(g[s.cls]=g[s.cls]||[]).push(s));let h='';\n Object.keys(g).forEach(k=>{h+='<div class=\"grp\">Class '+esc(k)+'<\/div>'+g[k].map(s=>{const p=photos[s.id];\n  return '<div class=\"it\" data-id=\"'+esc(s.id)+'\"><div class=\"th\">'+(p?'<img src=\"'+p.d+'\">':(s.has?'In app':'No<br>photo'))+'<\/div><div class=\"grow\"><div class=\"nm\">'+esc(s.name)+'<\/div><div class=\"mu\">Roll '+esc(s.roll||'-')+' · '+esc(s.id)+(s.father?' · F: '+esc(s IP (store only, no libraries needed)\nconst CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();\nconst crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};\nfunction makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;const dt=new Date(),T=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1),Dd=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();\n files.forEach(f=>{const n=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;\n  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(10,T,true);l.setUint16(12,Dd,true);l.setUint32(14,crc,true);l.setUint32(18,sz,true);l.setUint32(22,sz,true);l.setUint16(26,n.length,true);\n  parts.push(new Uint8Array(l.buffer),n,f.data);\n  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,T,true);c.setUint16(14,Dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);\n  cd.push(new Uint8Array(c.buffer),n);off+=30+n.length+sz});\n const cs=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);\n return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'})}\nconst b64=d=>{const s=atob(d.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};\n$('#send').onclick=()=>{const list=stu.filter(s=>!s.has&&photos[s.id]);if(!list.length)return;\n const files=list.map(s=>({name:s.id.replace(/[^A-Za-z0-9._-]/g,'_')+'.jpg',data:b64(photos[s.id].d)}));\n const note='Photos from '+D.teacher+' ('+D.classes.join( function parseVcf(txt){txt=String(txt||'').replace(/\r\n?/g,'\n').replace(/=\n/g,'').replace(/\n[ \t]/g,'');const out=[];
 txt.split(/BEGIN:VCARD/i).slice(1).forEach(card=>{let fn='',nn='';const tels=[];
  card.split('\n').forEach(line=>{const i=line.indexOf(':');if(i<0)return;const K=line.slice(0,i).toUpperCase(),v0=line.slice(i+1);const val=/ENCODING=QUOTED-PRINTABLE/.test(K)?qpDec(v0):v0;
   if(/^FN(;|$)/.test(K))fn=val.trim();else if(/^N(;|$)/.test(K))nn=val.split(';').filter(Boolean).reverse().join(' ').trim();
   else if(/^(ITEM\d+\.)?TEL(;|$)/.test(K)){const d=nd(val).replace(/\D/g,'');if(d.length>=10){const t=d.slice(-10);if(!tels.includes(t))tels.push(t)}}});

const nrm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]/g,'');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const similar=(a,b)=>{a=nrm(a);b=nrm(b);if(!a||!b)return false;if(a===b)return true;const L=Math.min(a.length,b.length);return L>=5&&lev(a,b)<=(L>=12?2:1)};
const refOf=s=>s.ckey+'|'+s.id;
const pairKey=(a,b)=>[refOf(a),refOf(b)].sort().join('~');
DP.compute=function(){const all=allStudents(),dis=new Set((S.meta.dupok&&S.meta.dupok.k)||[]);const seen=new Set(),red=[],yellow=[];
 const add=(arr,a,b,why)=>{const key=pairKey(a,b);if(dis.has(key)||seen.has(key)||refOf(a)===refOf(b))return;seen.add(key);arr.push({a:refOf(a),b:refOf(b),key,why})};
 // RED 1: same ID in more than one place
 const byId={};all.forEach(s=>(byId[s.id]=byId[s.id]||[]).push(s));Object.values(byId).forEach(l=>{for(let i=1;i<l.length;i++)add(red,l[0],l[i],'Same ID in two places')});
 // RED 2: same roll in the same class
 const byCls={};all.forEach(s=>(byCls[s.ckey]=byCls[s.ckey]||[]).push(s));
 Object.values(byCls).forEach(l=>{const r={};l.forEach(s=>{if(String(s.roll||'').trim())(r[String(s.roll).trim()]=r[String(s.roll).trim()]||[]).push(s)});
  Object.values(r).forEach(g=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)add(red,g[i],g[j],similar(g[i].name,g[j].name)?'Same name + class + roll':'Same roll number in the same class')})});
 // RED 3: identical photo on different students
 const byPh={};all.forEach(s=>{const t=S.thumbs[s.id];if(t&&t.d)(byPh[t.d]=byPh[t.d]||[]).push(s)});Object.values(byPh).forEach(g=>{for(let i=1;i<g.length;i++)add(red,g[0],g[i],'Both photos are identical')});
 // YELLOW 1: same class, similar name AND same father
 Object.values(byCls).forEach(l=>{for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j];if(similar(a.name,b.name)&&similar(a.father,b.father))add(yellow,a,b,'Similar name + same father in the same class')}});
 // YELLOW 2: two classes, same name + father + mobile
 const k3={};all.forEach(s=>{const d=String(s.contact||'').replace(/\D/g,'');if(nrm(s.name)&&nrm(s.father)&&d)(k3[nrm(s.name)+'|'+nrm(s.father)+'|'+d]=k3[nrm(s.name)+'|'+nrm(s.father)+'|'+d]||[]).push(s)});
 Object.values(k3).forEach(g=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)if(g[i].ckey!==g[j].ckey)add(yellow,g[i],g[j],'Same name + father + mobile in two classes')});
 // BLUE: siblings (same father name + same mobile) and cousins (same mobile, different fathers); decided families leave this list
 const sd=S.meta.sib||{},decided=new Set([...(sd.yes||[]),...(sd.no||[]),...(sd.cous||[])]);const fam={};
 all.forEach(s=>{if(!nrm(s.father))return;[s.contact,s.contact2].forEach(c=>{const d=String(c||'').replace(/\D/g,'');if(d)(fam[nrm(s.father)+'|'+d]=fam[nrm(s.father)+'|'+d]||[]).push(s)})});
 const sibs=[],seenF=new Set();Object.entries(fam).forEach(([k,g])=>{const u=[];g.forEach(s=>{if(!u.some(x=>x.id===s.id||similar(x.name,s.name)))u.push(s)});
  if(u.length>=2){const key=u.map(x=>x.id).sort().join('+');if(seenF.has(key)||decided.has(key))return;seenF.add(key);u.key=key;u.fname=u[0].father;u.mob=k.split('|')[1];sibs.push(u)}});
 const cm={};all.forEach(s=>[s.contact,s.contact2].forEach(c=>{const d=String(c||'').replace(/\D/g,'');if(d.length===10)(cm[d]=cm[d]||[]).push(s)}));
 const cous=[],seenC=new Set();Object.entries(cm).forEach(([mob,g])=>{const u=[];g.forEach(s=>{if(!u.some(x=>x.id===s.id))u.push(s)});if(u.length<2)return;const fams=[];u.forEach(s=>{const f=fams.find(F=>nrm(s.father)&&similar(F[0].father,s.father));if(f)f.push(s);else fams.push([s])});if(fams.length<2)return;
  const key=u.map(x=>x.id).sort().join('+');if(seenC.has(key)||decided.has(key))return;seenC.add(key);u.key=key;u.mob=mob;cous.push(u)});
 DP.res={red,yellow,sibs,cous};DP.count=red.length+yellow.length};
const byRef=r=>allStudents().find(s=>refOf(s)===r);
// after add / edit / import: tell the admin if red duplicates appeared
function autoDupCheck(ids){if(!isAdmin())return;DP.compute();let n=DP.res.red.filter(p=>!ids||ids.some(i=>p.a.endsWith('|'+i)||p.b.endsWith('|'+i))).length;if(!n)return;
 ask(`🔴 <b>${n}</b> possible duplicate(s) found. Check now?`,()=>{closeSheet();S.tab='dups';renderAll(true)},'Check now')}
function viewDups(){const v=$('#view');DP.compute();const r=DP.res,planN=Object.keys(DP.plan).length;
 const row=(p,cls)=>{const A=byRef(p.a),B=byRef(p.b);if(!A||!B)return '';const pl=DP.plan[p.key];
  return `<div class="item" data-pk="${esc(p.key)}"><div class="grow"><div class="nm">${esc(A.name)} <span class="muted">↔</span> ${esc(B.name)}</div><div class="mt">${esc(A.cls)} / ${esc(B.cls)} · Roll ${esc(A.roll||'-')} / ${esc(B.roll||'-')} · <b>${esc(p.why)}</b></div></div>${pl?`<span class="pill ${pl.act==='keep'?'r':'g'}">${pl.act==='keep'?'One will be deleted':'Both stay'}</span>`:`<span class="pill ${cls}">Review</span>`}</div>`};
 v.innerHTML=`<h2>Duplicate check</h2><p class="muted small">A matching name alone is never treated as a duplicate. Siblings (same father and mobile) are not duplicates. Nothing is deleted until you tap "Apply" below.</p>
<div class="box"><div class="row"><span class="pill r">🔴 Sure / almost sure: ${r.red.length}</span><span class="pill y">🟡 Maybe: ${r.yellow.length}</span><span class="pill b">🔵 Families: ${r.sibs.length+(r.cous||[]).length}</span></div></div>
${planN?`<div class="box" style="border-color:var(--accent)"><b>Decided: ${planN}</b><div class="row" style="margin-top:8px"><button class="btn" id="dpGo">Apply (${planN})</button><button class="btn sec" id="dpNo">Cancel plan</button></div></div>`:''}
<div class="box"><h3>🔴 Sure / almost sure (${r.red.length})</h3>${r.red.length?r.red.map(p=>row(p,'r')).join(''):'<p class="muted small">None.</p>'}</div>
<div class="box"><h3>🟡 Possible duplicates (${r.yellow.length})</h3>${r.yellow.length?r.yellow.map(p=>row(p,'y')).join(''):'<p class="muted small">None.</p>'}</div>
${sibBox()}`;
 v.querySelectorAll('[data-pk]').forEach(i=>i.onclick=()=>openPair(i.dataset.pk));bindSib(v);
 if($('#dpNo'))$('#dpNo').onclick=()=>{DP.plan={};viewDups()};if($('#dpGo'))$('#dpGo').onclick=()=>ask(`Apply ${planN} decisions? Those marked "Delete" will be removed permanently (missing details will be filled into the one that is kept).`,applyPlan,'Apply')}

function sibBox(){const r=DP.res.sibs,c=DP.res.cous||[],sd=S.meta.sib||{};const lim=DP.sibMore||40;const all=allStudents();
 const nm=k=>String(k).split('+').map(id=>{const s=all.find(x=>x.id===id);return s?`<div class="small">• ${esc(s.name)} <span class="muted">· Class ${esc(s.cls)} · Father: ${esc(s.father||'-')}</span></div>`:''}).join('');
 const grp=(g,why)=>(DP.gmap=DP.gmap||{},DP.gmap[g.key]=g,`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="small"><b>Why:</b> ${why}</div>${g.map(s=>`<div class="small" style="display:flex;align-items:center;gap:6px"><span class="grow">• ${esc(s.name)} <span class="muted">· Class ${esc(s.cls)} · Roll ${esc(s.roll||'-')}${s.father?' · Father: '+esc(s.father):''}</span></span><button class="btn sec sm" onclick="openStudent('${esc(s.id)}')">Edit</button><button class="menub" onclick="stMenu('${esc(s.id)}')" aria-label="Menu">⋮</button></div>`).join('')}<div class="row" style="margin-top:6px"><button class="btn sm" data-sy="${esc(g.key)}">Siblings</button><button class="btn sm" data-sk="${esc(g.key)}">Cousins</button><button class="btn sec sm" data-sn="${esc(g.key)}">Different families</button><button class="btn sec sm" data-sd="${esc(g.key)}">Double entry (same child)</button></div></div>`);
 const vl=(keys,lab)=>`<details style="margin-top:8px"><summary><b>${lab} (${keys.length})</b></summary>${keys.map(k=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${nm(k)}<button class="btn sec sm" data-su="${esc(k)}" style="margin-top:4px">Undo — back to review</button></div>`).join('')||'<p class="muted small">None.</p>'}</details>`;
 return `<div class="box"><h3>🔵 Families to review (${r.length} sibling groups · ${c.length} cousin groups)</h3><p class="muted small" style="margin-top:0">Same <b>father's name + mobile</b> → probably <b>siblings</b>. Same <b>mobile but different fathers</b> (for example a grandfather's number) → probably <b>cousins</b>. Choose one; the family then moves to its own list below and leaves this review.</p>
<b class="small">Siblings?</b>${r.slice(0,lim).map(g=>grp(g,`same father name <b>${esc(g.fname)}</b> + same mobile <b>${esc(g.mob)}</b>`)).join('')||'<p class="muted small">None.</p>'}${r.length>lim?`<div style="padding-top:8px"><button class="btn sec sm" id="sibMore">Show more (${r.length-lim})</button></div>`:''}
<div style="margin-top:12px"></div><b class="small">Cousins?</b>${c.slice(0,lim).map(g=>grp(g,`same mobile <b>${esc(g.mob)}</b>, different fathers`)).join('')||'<p class="muted small">None.</p>'}</div>
<div class="box"><h3>Decided families</h3>${vl(sd.yes||[],'Verified siblings')}${vl(sd.cous||[],'Cousins')}${vl(sd.no||[],'Different families')}</div>`}
function bindSib(v){const setS=async(k,which)=>{const sd=Object.assign({yes:[],no:[],cous:[]},S.meta.sib||{});['yes','no','cous'].forEach(w=>sd[w]=(sd[w]||[]).filter(x=>x!==k));if(which)sd[which].push(k);
  try{await enqueue(()=>S.db.doc('meta/sib').set(sd));S.meta.sib=sd;DP.dirty=true;viewDups()}catch(e){toast(errMsg(e),6000)}};
 v.querySelectorAll('[data-sy]').forEach(b=>b.onclick=()=>setS(b.dataset.sy,'yes'));v.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>setS(b.dataset.sk,'cous'));v.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>setS(b.dataset.sn,'no'));v.querySelectorAll('[data-su]').forEach(b=>b.onclick=()=>setS(b.dataset.su,null));
 v.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{const g=(DP.gmap||{})[b.dataset.sd];if(!g)return;const L=[...g];const pair=(A,B)=>doubleEntry(A,B,'de_'+A.id+'_'+B.id);if(L.length===2)return pair(L[0],L[1]);
  const d=$('#dlg');d.hidden=false;d.innerHTML=`<div><b>Which two entries are the same child?</b>${L.map(s=>`<label class="row small" style="gap:6px;margin-top:6px"><input type="checkbox" data-pk2="${esc(s.id)}"> ${esc(s.name)} · ${esc(s.cls)} · Roll ${esc(s.roll||'-')}</label>`).join('')}<div class="row" style="margin-top:10px"><button class="btn grow" id="pk_go">Continue</button><button class="btn sec" id="pk_x">Cancel</button></div></div>`;$('#pk_x').onclick=unbusy;$('#pk_go').onclick=()=>{const c=[...d.querySelectorAll('[data-pk2]:checked')].map(i=>L.find(s=>s.id===i.dataset.pk2));if(c.length!==2)return toast('Tick exactly two.',3000);unbusy();pair(c[0],c[1])}});
 if($('#sibMore'))$('#sibMore').onclick=()=>{DP.sibMore=(DP.sibMore||40)+40;viewDups()}}
async function dupOk(key){const d={k:[...new Set([...((S.meta.dupok&&S.meta.dupok.k)||[]),key])]};await enqueue(()=>S.db.doc('meta/dupok').set(d));S.meta.dupok=d}
function doubleEntry(A,B,key){const sh=$('#sheet');sh.hidden=false;const col=s=>`<div class="box"><b>${esc(s.name)}</b><div class="muted small">Class ${esc(s.cls)} · Roll ${esc(s.roll||'-')} · ${esc(s.id)}</div><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px"><button class="btn sec sm" data-de="tc" data-r="${esc(refOf(s))}">This entry: left school — with TC</button><button class="btn sec sm" data-de="notc" data-r="${esc(refOf(s))}">This entry: left school — without TC</button><button class="btn sec sm" data-de="prov" data-r="${esc(refOf(s))}">This entry: provisional admission</button></div></div>`;
 sh.innerHTML=`<div><h2>Same child entered twice</h2><p class="muted small">Choose what happened to each entry. Nobody is deleted. If the child is now in another class, go back and use "Keep this one, delete the other". If they are really two different children, use "Keep both".</p>${col(A)}${col(B)}<div class="row"><button class="btn sec grow" id="de_x">Back</button></div></div>`;
 $('#de_x').onclick=()=>openPair(key);sh.querySelectorAll('[data-de]').forEach(b=>b.onclick=async()=>{const s=byRef(b.dataset.r);if(!s)return;b.disabled=true;try{await applyStatus(s,b.dataset.de,today(),'Double entry','');await dupOk(key);toast('Done ✔');closeSheet();DP.dirty=true;renderAll(true)}catch(e){b.disabled=false;toast(errMsg(e),6000)}})}
function openPair(key){const p=[...DP.res.red,...DP.res.yellow].find(x=>x.key===key);if(!p)return;const A=byRef(p.a),B=byRef(p.b);if(!A||!B)return;const sh=$('#sheet');sh.hidden=false;
 const colW=Math.min(innerWidth,760)/2-30,sc=Math.max(.3,colW/338);
 const rows=[['Name','name'],['Class','cls'],['Seating class','seat'],['Roll','roll'],['ID','id'],['Father','father'],['Mobile','contact'],['Village','village'],['Route 1','route1'],['Photo','_ph']];
 const val=(s,k)=>k==='_ph'?(hasThumb(s.id)?'Yes':'No'):(s[k]||'');
 const card=(s)=>`<div class="pvw" style="width:${338*sc}px;height:${540*sc}px"><div style="transform:scale(${sc});transform-origin:top left;width:338px">${cardHTML(s,(S.thumbs[s.id]||{}).d)}</div></div>`;
 sh.innerHTML=`<div><div class="row"><h2 class="grow" style="margin:0">Compare both</h2><button class="btn sec sm" id="px">Close</button></div><p class="small"><b>${esc(p.why)}</b></p>
<div class="cols2"><div>${card(A)}<button class="btn grow" style="width:100%;margin-top:6px" id="kA">Keep this one, delete the other</button></div><div>${card(B)}<button class="btn grow" style="width:100%;margin-top:6px" id="kB">Keep this one, delete the other</button></div></div>
<div class="scr" style="margin-top:10px"><table class="t"><tr><th></th><th>Left</th><th>Right</th></tr>${rows.map(([l,k])=>{const a=val(A,k),b=val(B,k);return `<tr><td class="muted">${l}</td><td class="${a!==b?'df':''}">${esc(a||'—')}</td><td class="${a!==b?'df':''}">${esc(b||'—')}</td></tr>`}).join('')}</table></div>
<div class="row" style="margin-top:10px"><button class="btn sec grow" id="bt">Keep both</button><button class="btn sec grow" id="de">Same child entered twice…</button><button class="btn sec grow" id="px2">Not now</button></div><p class="muted small">Details that are empty in the one you keep will be filled from the other. Photo/RTE will also be carried over if needed.</p></div>`;
 const done=()=>{closeSheet();viewDups()};
 $('#px').onclick=$('#px2').onclick=closeSheet;$('#de').onclick=()=>doubleEntry(A,B,key);
 $('#kA').onclick=()=>{DP.plan[key]={act:'keep',keep:p.a,drop:p.b};done()};$('#kB').onclick=()=>{DP.plan[key]={act:'keep',keep:p.b,drop:p.a};done()};$('#bt').onclick=()=>{DP.plan[key]={act:'both'};done()}}
async function applyPlan(){const items=Object.entries(DP.plan);busy('Applying…');BULK.ids=[];const ok=[...((S.meta.dupok&&S.meta.dupok.k)||[])];let merged=0;
 try{for(let i=0;i<items.length;i++){busyP(`${i+1} / ${items.length}`,i/items.length);const [key,pl]=items[i];
   if(pl.act==='both'){ok.push(key);continue}
   const A=byRef(pl.keep),B=byRef(pl.drop);if(!A||!B)continue;const n=Object.assign({},A);STF.forEach(f=>{if(!n[f]&&B[f])n[f]=B[f]});
   if(B.id!==A.id){if(!hasThumb(A.id)&&hasThumb(B.id)){const ph=await fullPhoto(B.id),th=S.thumbs[B.id],at=Date.now();await save(()=>S.db.doc('photos/'+A.id).set({d:ph,cls:A.cls,at}));await save(()=>S.db.doc('thumbs/'+A.id).set({d:th.d,cls:A.cls,at}));S.thumbs[A.id]={d:th.d,cls:A.cls,at};photoCache[A.id]={at,d:ph}}
    if(B.rte&&!A.rte){const d={v:1,at:Date.now()};await save(()=>S.db.doc('rte/'+A.id).set(d));S.rte[A.id]=d}}
   await saveStudent(n,A);const B2=byRef(pl.drop);if(B2)await delStudent(B2,true);merged++}
  if(ok.length!==((S.meta.dupok&&S.meta.dupok.k)||[]).length){const d={k:[...new Set(ok)]};await enqueue(()=>S.db.doc('meta/dupok').set(d));S.meta.dupok=d}
  DP.plan={};unbusy();toast(`Done ✔ — ${merged} pair(s) merged.`);renderAll(true);bulkEnd('Duplicates merged')}catch(e){unbusy();toast(errMsg(e),7000);bulkEnd('Duplicates merged')}}

function sqCrop(img,size){const w=img.width||img.naturalWidth,h=img.height||img.naturalHeight,side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)*0.4;const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,sx,sy,side,side,0,0,size,size);return c}
const natCmp=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true});
async function planBulk(files){const stu=bulkStudents(BK.cls);if(!stu.length){toast('There are no students in this class.');return}
 const fi=files.map(f=>({f,name:f.name.split(/[\\/]/).pop(),base:f.name.split(/[\\/]/).pop().replace(/\.[^.]+$/,'')}));const pairs=[],unmatched=[];
 if(BK.mode==='order'){fi.sort((a,b)=>natCmp(a.name,b.name));fi.forEach((x,i)=>{if(stu[i])pairs.push([x,stu[i]]);else unmatched.push(x.name)})}
 else fi.forEach(x=>{let hit=[];const n=alnum(x.base);
  if(BK.mode==='roll'){const m=x.base.match(/\d+/);if(m)hit=stu.filter(s=>parseInt(s.roll,10)===parseInt(m[0],10))}
  else if(BK.mode==='id'){hit=stu.filter(s=>{const sid=alnum(s.id);return n===sid||n.includes(sid)||(/^\d{1,4}$/.test(x.base)&&sid.endsWith(x.base.padStart(4,'0')))})}
  else{const low=x.base.toLowerCase();hit=stu.filter(s=>alnum(s.name)===n||String(s.name).toLowerCase().split(/\s+/).filter(t=>t.length>=2).every(t=>low.includes(t)))}
  hit.length===1?pairs.push([x,hit[0]]):unmatched.push(x.name)});
 busy('Checking photos…');const used=new Set(),items=[];
 try{for(let i=0;i<pairs.length;i++){busyP(`${i+1} / ${pairs.length}`,i/pairs.length);const [x,s]=pairs[i];
   if(used.has(s.id)){items.push({s,name:x.name,status:'dup'});continue}used.add(s.id);
   if(hasThumb(s.id)){items.push({s,name:x.name,status:'has'});continue}
   try{const im=await loadImg(x.f);const big=sqCrop(im,450),sm=sqCrop(im,80);items.push({s,name:x.name,status:'ok',on:true,d:big.toDataURL('image/jpeg',0.85),th:sm.toDataURL('image/jpeg',0.8)})}catch(e){unmatched.push(x.name+' (photo could not be opened)')}await new Promise(r=>setTimeout(r,0))}
  unbusy();BK.items=items;BK.unmatched=unmatched;BK.nofile=stu.filter(s=>!used.has(s.id));viewBulk()}catch(e){unbusy();toast('Check failed: '+(e&&e.message||e))}}

const ALIAS={name:['studentname','name','nameofstudent','student','fullname'],cls:['class','std','standard','grade','classname'],sec:['section','sec'],roll:['rollno','roll','rollnumber','rollno.','rno'],father:['fathername','father','guardian','guardianname','parentname'],contact2:['mothercontact','mothermobile','mothermobileno','mobile2','secondmobile','alternatemobile'],sr:['srno','srnumber','srno.','admissionnumbersrno','admissionnumber','admissionno','scholarno','scholarnumber'],adm:['admissiondate','dateofadmission','doa','dateofjoining'],dob:['dateofbirth','dob','birthdate'],contact:['fathercontact','parentmobile','fathermobile','mobile','mobileno','contact','contactno','phone','phoneno','emergencycontact'],village:['village','villagename','city','place','address'],native:['nativedistrict','homedistrict','motherdistrict','nativeplace','district'],seat:['seatingclass','seating','seat','seatclass','sittingclass','seatingsection'],id:['studentid','id','idno','uniqueid','idnumber'],r1:['busrouteprimary','busroutep','primaryroute','route1','busroute','route','transportroute','transport','transportroute'],r2:['busroutesecondary','busroutes','secondaryroute','route2'],s1:['primarystop','primaryvillage','primaryroutevillage','primarystopvillage','stop1','busstopprimary','primaryroutestop'],s2:['secondarystop','secondaryvillage','secondaryroutevillage','secondarystopvillage','stop2','busstopsecondary','secondaryroutestop'],rte:['rte','rteyesno','rtestudent','rtechild'],floor:['floor','floorno','floornumber'],room:['room','roomno','roomnumber'],gender:['gender','sex'],cat2:['socialcategory','category','socialcat'],mother:['mothername','mother'],stopno:['busstopno','stopno','stopnumber','busstopnumber'],spec:['specialno','specialnumber','specialid'],sc:['staffchild'],tmp:['notinpsp','notinpsplist']};
function normFloor(v){const l=String(v||'').trim().toLowerCase();if(!l)return'';if(/^(g|gf|0|ground|ground\s*floor)$/.test(l))return'Ground Floor';if(/^(1|1st|first|first\s*floor)$/.test(l))return'First Floor';if(/^(2|2nd|second|second\s*floor)$/.test(l))return'Second Floor';if(/^(3|3rd|third|third\s*floor)$/.test(l))return'Third Floor';return String(v).trim()}
function splitRoute(r,st){r=String(r||'').trim();st=String(st||'').trim();if(r&&!st){const m=r.match(/^(.*?\d+)\s*[-–]\s*(.+)$/);if(m){r=m[1].trim();st=m[2].trim()}}return[r,st]}
function parseRows(rows){const out=[];const norm=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
 rows.forEach((r,i)=>{const m={};Object.keys(r).forEach(k=>m[norm(k)]=r[k]);const pick=a=>{for(const k of ALIAS[a]){if(m[k]!==undefined&&String(m[k]).trim()!=='')return (['roll','contact','contact2','id','room'].includes(a)?nd(String(m[k]).trim()):String(m[k]).trim())}return''};
  let cls=pick('cls');let seat=pick('seat');if(seat)seat=normClass(seat);const sec=pick('sec');if(sec&&!/[-–\/]\s*[A-Za-z]$/.test(cls))cls=cls+' - '+sec;cls=normClass(cls);
  let ct=pick('contact');const d=ct.replace(/\D/g,'');if(d.length>=10)ct=d.slice(-10);let ct2=pick('contact2');const d2=ct2.replace(/\D/g,'');if(d2.length>=10)ct2=d2.slice(-10);
  let r1=pick('r1'),r2=pick('r2');if(r1&&!r2&&/[\/,;]/.test(r1)){const p=r1.split(/[\/,;]/).map(x=>x.trim()).filter(Boolean);r1=p[0]||'';r2=p[1]||''}
  let[x1,t1]=splitRoute(r1,pick('s1')),[x2,t2]=splitRoute(r2,pick('s2'));
  out.push({line:i+2,name:tc(pick('name')),cls:cls.trim(),seat:seat,roll:pick('roll'),father:tc(pick('father')),contact:ct,contact2:ct2,sr:pick('sr'),adm:parseDate(pick('adm')),dob:parseDate(pick('dob')),village:vu(pick('village')),native:tc(pick('native')),mother:tc(pick('mother')),gender:(()=>{const v=pick('gender').toLowerCase();return /^(m|male|boy)/.test(v)?'M':/^(f|female|girl)/.test(v)?'F':''})(),cat2:pick('cat2').toUpperCase().replace(/\s+/g,''),stopno:pick('stopno'),spec:pick('spec'),sc:/^(y|yes|1|true)/i.test(pick('sc'))?'1':'',tmp:/^(y|yes|1|true)/i.test(pick('tmp'))?'1':'',id:cleanId(pick('id')),route1:x1,stop1:t1,route2:x2,stop2:t2,floor:normFloor(pick('floor')),room:pick('room'),rte:(()=>{const v=pick('rte').toLowerCase();return v?/^(y|yes|true|1|r|rte|हाँ|हां)$/.test(v):null})()})});return out}
function planImport(recs,updOnly){const cur={};for(const k in S.classes){cur[k]={name:S.classes[k].name,floor:S.classes[k].floor||'',room:S.classes[k].room||'',students:(S.classes[k].students||[]).map(s=>Object.assign({},s))}}
 const byId={},byKey={};const reg=(s,k)=>{byId[s.id]={s,k};byKey[(s.name+'|'+s.roll+'|'+cur[k].name).toLowerCase()]=s.id};for(const k in cur)cur[k].students.forEach(s=>reg(s,k));
 const touched=new Set(),moved=[],skipped=[];let nNew=0,nUpd=0,nSame=0,nFR=0;const rteOps=[],dobOps=[];const dobSet=(id,d)=>{if(d&&!((S.priv[id]||{}).dob===d)&&!dobOps.some(x=>x.id===id))dobOps.push({id,dob:d})};const frMap={};const rteSet=(id,v)=>{if(v===null||v===undefined)return;const c0=!!(S.rte[id]&&S.rte[id].v===1);if(c0!==v)rteOps.push({id,v})};const seen=new Set();const used=new Set(Object.keys(byId));
 recs.forEach(r=>{if(!r.name||!r.cls){skipped.push(`Row ${r.line}: name or class is empty`);return}
  const key=classKey(r.cls);if(r.floor||r.room){if(!cur[key])cur[key]={name:r.cls,floor:'',room:'',students:[]};const c0=cur[key];if((r.floor&&c0.floor!==r.floor)||(r.room&&c0.room!==r.room)){if(r.floor)c0.floor=r.floor;if(r.room)c0.room=r.room;touched.add(key);nFR++;frMap[key]={floor:c0.floor,room:c0.room}}}
  let hit=null;if(r.id&&byId[r.id])hit=byId[r.id];else if(!r.id){const id=byKey[(r.name+'|'+r.roll+'|'+r.cls).toLowerCase()];if(id)hit=byId[id]}
  if(hit){if(seen.has(hit.s.id)){skipped.push(`Row ${r.line}: this student is repeated in the file`);return}seen.add(hit.s.id);rteSet(hit.s.id,r.rte);dobSet(hit.s.id,r.dob);
   const o=hit.s,n=Object.assign({},o);['name','roll','father','contact','contact2','village','native','route1','stop1','route2','stop2','seat','sr','adm','mother','gender','cat2','stopno','spec','sc','tmp'].forEach(f=>{if(r[f])n[f]=r[f]});
   const clsChanged=cur[hit.k].name!==r.cls;const chg=STF.some(f=>(n[f]||'')!==(o[f]||''))||clsChanged;if(!chg){nSame++;return}
   if(clsChanged){cur[hit.k].students=cur[hit.k].students.filter(x=>x.id!==o.id);touched.add(hit.k);if(!cur[key])cur[key]={name:r.cls,floor:'',room:'',students:[]};cur[key].students.push(n);touched.add(key);moved.push(o.id);byId[o.id]={s:n,k:key}}
   else{Object.assign(o,n);touched.add(hit.k)}nUpd++;return}
  if(updOnly){skipped.push(`Row ${r.line}: ${r.name} — not in the app (not added)`);return}
  if(r.id&&used.has(r.id)){skipped.push(`Row ${r.line}: ID ${r.id} repeated`);return}
  const id=r.id||newId(used);used.add(id);rteSet(id,r.rte);dobSet(id,r.dob);const n={id,seat:r.seat||'',name:r.name,roll:r.roll,father:r.father,contact:r.contact,contact2:r.contact2||'',sr:r.sr||'',adm:r.adm||'',village:r.village,native:r.native,route1:r.route1,stop1:r.stop1,route2:r.route2,stop2:r.stop2,mother:r.mother||'',gender:r.gender||'',cat2:r.cat2||'',stopno:r.stopno||'',spec:r.spec||'',sc:r.sc||'',tmp:r.tmp||''};
  if(!cur[key])cur[key]={name:r.cls,floor:'',room:'',students:[]};cur[key].students.push(n);touched.add(key);byId[id]={s:n,k:key};byKey[(n.name+'|'+n.roll+'|'+r.cls).toLowerCase()]=id;nNew++});
 return{cur,touched:[...touched],moved,skipped,nNew,nUpd,nSame,nFR,rteOps,dobOps,frMap}}

function clStudents(o){let l=allStudents().filter(s=>canTouch(s));
 if(o.cls)l=l.filter(s=>s.cls===o.cls||baseOf(s.cls)===o.cls);
 if(o.sec)l=l.filter(s=>clSplit(s.cls).s===o.sec);

function fsMatch(list){const all=allStudents(),by={};all.forEach(s=>{const k=fsNorm(s.name);(by[k]=by[k]||[]).push(s)});const out={match:[],only:[],used:new Set()};

function statsData(){const all=allStudents();const cls=[...new Set(all.map(s=>s.cls))].sort(cmpClass);const G=s=>s.gender==='F'?1:s.gender==='M'?0:2;const CT=CATS2.concat(['Not set']);const Ci=s=>{const i=CATS2.indexOf(s.cat2);return i<0?CATS2.length:i};
 const cnt=(arr,f,n)=>{const a=Array(n).fill(0);arr.forEach(s=>a[f(s)]++);return a};const tot=a=>a.reduce((x,y)=>x+y,0);
 const t1=cls.map(c=>{const a=cnt(all.filter(s=>s.cls===c),G,3);return[c,...a,tot(a)]});const a0=cnt(all,G,3);t1.push(['School total',...a0,tot(a0)]);
 const t2=cls.map(c=>{const a=cnt(all.filter(s=>s.cls===c),Ci,6);return[c,...a,tot(a)]});const b0=cnt(all,Ci,6);t2.push(['School total',...b0,tot(b0)]);
 const rte=all.filter(s=>s.rte),non=all.filter(s=>!s.rte);const t3=[['RTE',...cnt(rte,G,3),rte.length],['Non-RTE',...cnt(non,G,3),non.length],['Total',...a0,all.length]];
 const t4=CT.map((c,i)=>{const x=rte.filter(s=>Ci(s)===i).length,y=non.filter(s=>Ci(s)===i).length;return[c,x,y,x+y]});t4.push(['Total',rte.length,non.length,all.length]);
 const t5=['Boys','Girls','Not set'].map((n,g)=>{const a=cnt(all.filter(s=>G(s)===g),Ci,6);return[n,...a,tot(a)]});t5.push(['Total',...b0,tot(b0)]);
 const t6=[['RTE',...cnt(rte,Ci,6),rte.length],['Non-RTE',...cnt(non,Ci,6),non.length]];
 return[['Boys and girls (class-wise)',['Class','Boys','Girls','Not set','Total'],t1],['Social category (class-wise)',['Class',...CT,'Total'],t2],['RTE and gender',['','Boys','Girls','Not set','Total'],t3],['Category and RTE',['Category','RTE','Non-RTE','Total'],t4],['Gender and category',['',...CT,'Total'],t5],['RTE / Non-RTE by category',['',...CT,'Total'],t6]]}
function reconBox(){const all=allStudents(),ids=new Set(all.map(s=>s.id)),T=all.length,rte=all.filter(s=>s.rte).length,nr=T-rte,bo=all.filter(s=>s.gender==='M').length,gi=all.filter(s=>s.gender==='F').length,ns=T-bo-gi;
 const cs=CATS2.map(c=>[c,all.filter(s=>s.cat2===c)]),cn=T-cs.reduce((a,x)=>a+x[1].length,0);
 const L=(ok,t)=>`<div class="row small"><span class="${ok?'ok':'bad'}">${ok?'✔':'✖'}</span><span class="grow">${t}</span></div>`;
 const catBad=cs.filter(([c,l])=>l.length!==l.filter(s=>s.rte).length+l.filter(s=>!s.rte).length);
 return `<div class="box"><h3>Check: do the totals match?</h3>${L(T===ids.size,`Students ${T} · distinct IDs ${ids.size}${T===ids.size?'':' — same ID appears twice (see Duplicates)'}`)}${L(true,`RTE ${rte} + Non-RTE ${nr} = ${rte+nr}`)}${L(bo+gi+ns===T,`Boys ${bo} + Girls ${gi} + Not set ${ns} = ${bo+gi+ns}`)}${L(true,`Categories ${T-cn} + Not set ${cn} = ${T}`)}${L(!catBad.length,'Every category: RTE + Non-RTE = category total')}<p class="muted small" style="margin:6px 0 0">Counts include only children currently in school (left / removed students are not counted). Nothing here changes any record.</p></div>`}
function statsLists(){const all=allStudents();const cls=[...new Set(all.map(s=>s.cls))].sort(cmpClass);const G=s=>s.gender==='F'?1:s.gender==='M'?0:2;const Ci=s=>{const i=CATS2.indexOf(s.cat2);return i<0?CATS2.length:i};
 const by=(arr,f,n)=>{const a=Array.from({length:n},()=>[]);arr.forEach(s=>a[f(s)].push(s));return a};
 const rte=all.filter(s=>s.rte),non=all.filter(s=>!s.rte);
 const t1=cls.map(c=>{const l=all.filter(s=>s.cls===c);return[...by(l,G,3),l]});t1.push([...by(all,G,3),all]);
 const t2=cls.map(c=>{const l=all.filter(s=>s.cls===c);return[...by(l,Ci,6),l]});t2.push([...by(all,Ci,6),all]);
 const t3=[[...by(rte,G,3),rte],[...by(non,G,3),non],[...by(all,G,3),all]];
 const t4=[0,1,2,3,4,5].map(i=>{const x=rte.filter(s=>Ci(s)===i),y=non.filter(s=>Ci(s)===i);return[x,y,x.concat(y)]});t4.push([rte,non,all]);
 const t5=[0,1,2].map(g=>{const l=all.filter(s=>G(s)===g);return[...by(l,Ci,6),l]});t5.push([...by(all,Ci,6),all]);
 const t6=[[...by(rte,Ci,6),rte],[...by(non,Ci,6),non]];return[t1,t2,t3,t4,t5,t6]}

 {const T=b.querySelectorAll('table.t');const mk=(tb,fn)=>{if(!tb)return;[...tb.querySelectorAll('tr')].slice(1).forEach((tr,i)=>{const td=tr.children[fn.col];if(td&&fn.get(i))td.innerHTML=cn(td.textContent,fn.get(i),fn.title(i))})};

async function restoreBin(id){const sn=await S.db.doc('bin/'+id).get();if(!sn.exists)throw{message:'Not found'};const b=sn.data(),s=b.s;if(findAny(s.id))throw{message:'A child with this ID already exists.'};
 const key=classKey(b.cls),cur=S.classes[key]||{name:b.cls,students:[]};const doc=cdoc(cur,{students:[...(cur.students||[]).filter(x=>x.id!==s.id),s],ok:false,okAt:0});await writeClass(doc);S.classes[key]=doc;
 const at=Date.now();if(b.ph){await save(()=>S.db.doc('photos/'+s.id).set({d:b.ph,cls:b.cls,at}))}if(b.th){await save(()=>S.db.doc('thumbs/'+s.id).set({d:b.th,cls:b.cls,at}));S.thumbs[s.id]={d:b.th,cls:b.cls,at}}
 if(b.rte){const d={v:1,at};await save(()=>S.db.doc('rte/'+s.id).set(d));S.rte[s.id]=d}if(b.dob){const d={dob:b.dob,at};await save(()=>S.db.doc('priv/'+s.id).set(d));S.priv[s.id]=d}
 await enqueue(()=>S.db.doc('bin/'+id).delete());logHist('restore',s,'Restored from recycle bin');refresh()}

 return{r,v}}

 const exp=[];

${extra.length?`<div style="margin-top:8px"><b class="small">Children at stops that are not in the timetable</b>${extra.map(k=>`<details class="stp"><summary>${esc(k)} <span class="cn" data-sr="${esc(r)}" data-sk="${esc(k)}" style="cursor:pointer" title="Tap to see all children">${C.s[k]}</span></summary><div class="small" style="margin:6px 0 0 18px">${nm(k)}</div></details>`).join('')}</div>`:''}</div>`};
 const body=keys.map(card).join('')||'<div class="box"><p class="muted small">No route yet. Fill village and route for the children, or make routes in Timetable.</p></div>';
 v.innerHTML=`<h2>Routes</h2><p class="muted small">Every route with its stops in order, the morning pick-up time, the evening drop time, and how many children board at each stop. Tap a stop to see the children. Times include any delay.</p>

async function doPromote(ns){busy('Promoting…');try{const keys=Object.keys(S.classes);await autoBak(keys,'Promotion to '+ns);const nd2={},moved=[];
  const get=(name)=>nd2[name]||(nd2[name]=cdoc(S.classes[classKey(name)]||{name,students:[]},{students:[],ok:false,okAt:0}));
  keys.forEach(k=>{const c=S.classes[k];get(c.name);(c.students||[]).forEach(s=>{if(s.left){get(c.name).students.push(s);return}const t=promoTarget(c.name);const o=Object.assign({},s,{seat:'',pd:''});
    if(t==='ALUMNI'){o.left={r:'passed',d:today(),n:'Promotion '+ns};get(c.name).students.push(pack(o))}else if(t){get(t).students.push(pack(o));moved.push({id:s.id,cls:t})}else get(c.name).students.push(pack(o))})});
  const names=Object.keys(nd2);for(let i=0;i<names.length;i++){busyP(`Classes ${i+1} / ${names.length}`,i/names.length*.5);const dd=nd2[names[i]];await writeClass(dd);S.classes[classKey(names[i])]=dd}
  for(let i=0;i<moved.length;i++){if(i%10===0)busyP(`Photos ${i+1} / ${moved.length}`,.5+i/moved.length*.5);const m=moved[i];if(S.thumbs[m.id]){await save(()=>S.db.doc('thumbs/'+m.id).update({cls:m.cls})).catch(()=>{});await save(()=>S.db.doc('photos/'+m.id).update({cls:m.cls})).catch(()=>{});S.thumbs[m.id]=Object.assign({},S.thumbs[m.id],{cls:m.cls})}}
  const n=Object.assign({},S.settings,{session:ns});await save(()=>S.db.doc('settings/school').set(n));S.settings=withDef(n);logHist('promotion',{},'All classes promoted; session '+ns);unbusy();toast('Done ✔ — session '+ns,6000);renderAll(true)}catch(e){unbusy();toast(errMsg(e),7000)}}
async function undoDialog(){let lj=null;try{const sn=await S.db.doc('meta/lastjob').get();lj=sn.exists?sn.data():null}catch(e){}
 if(!lj||!(lj.keys||[]).length)return toast('There is no big change to undo.');
 ask(`Undo <b>${esc(lj.job)}</b> (${new Date(lj.at).toLocaleString('en-IN')})? ${lj.keys.length} class(es) will go back to how they were before. Changes made after that job in these classes will be lost.`,async()=>{busy('Restoring…');try{const ids=[];
  for(let i=0;i<lj.keys.length;i++){busyP(`${i+1} / ${lj.keys.length}`,i/lj.keys.length);const sn=await S.db.doc('bak/'+lj.keys[i]).get();if(!sn.exists)continue;const b=sn.data();await writeClass(b.doc);S.classes[lj.keys[i]]=b.doc;(b.doc.students||[]).forEach(s=>ids.push({id:s.id,cls:b.doc.name}))}

  await enqueue(()=>S.db.doc('meta/lastjob').delete());logHist('undo',{},'Undid: '+lj.job);unbusy();toast('Undone ✔');renderAll(true)}catch(e){unbusy();toast(errMsg(e),7000)}},'Undo')}

async function applyRestore(o){const jobs=[];
 if(o.settings)jobs.push(['settings/school',o.settings]);
 Object.entries(o.classes||{}).forEach(([k,v])=>jobs.push(['classes/'+k,v]));Object.entries(o.rte||{}).forEach(([k,v])=>jobs.push(['rte/'+k,v]));Object.entries(o.cinfo||{}).forEach(([k,v])=>jobs.push(['cinfo/'+k,v]));
 Object.entries(o.thumbs||{}).forEach(([k,v])=>jobs.push(['thumbs/'+k,v]));Object.entries(o.photos||{}).forEach(([k,v])=>jobs.push(['photos/'+k,v]));
 if(o.dupok)jobs.push(['meta/dupok',o.dupok]);if(o.design)jobs.push(['meta/design',o.design]);if(o.villages)jobs.push(['meta/villages',o.villages]);if(o.bus)jobs.push(['meta/bus',o.bus]);if(o.sib)jobs.push(['meta/sib',o.sib]);Object.entries(o.contacts||{}).forEach(([k,v])=>jobs.push(['contacts/'+k,v]));Object.entries(o.priv||{}).forEach(([k,v])=>jobs.push(['priv/'+k,v]));
 busy('Restoring data…');
 try{for(let i=0;i<jobs.length;i++){if(i%10===0)busyP(`${i+1} / ${jobs.length}`,i/jobs.length);const [p,d]=jobs[i];await enqueue(()=>S.db.doc(p).set(d))}

function demoAvatar(seed){const mk=sz=>{const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),k=sz/300,hue=(seed*47)%360;x.fillStyle=`hsl(${hue},45%,82%)`;x.fillRect(0,0,sz,sz);x.fillStyle=`hsl(${(hue+180)%360},40%,38%)`;x.beginPath();x.ellipse(150*k,310*k,105*k,95*k,0,0,7);x.fill();x.fillStyle='#e8b98f';x.fillRect(128*k,170*k,44*k,50*k);x.beginPath();x.arc(150*k,135*k,62*k,0,7);x.fill();x.fillStyle='#2b1d14';x.beginPath();x.arc(150*k,112*k,64*k,Math.PI,0);x.fill();x.fillStyle='#222';x.beginPath();x.arc(128*k,140*k,5*k,0,7);x.arc(172*k,140*k,5*k,0,7);x.fill();x.strokeStyle='#8a3d2a';x.lineWidth=3*k;x.beginPath();x.arc(150*k,158*k,16*k,.2,Math.PI-.2);x.stroke();return c.toDataURL('image/jpeg',0.85)};return{d:mk(300),th:mk(80)}}
