        if (o.limit) cs.push(FS.limit(o.limit));
        try {
          const s = await FS.getDocs(FS.query(FS.collection(fs, c), ...cs));
          return s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; });

      },

      signIn: async function (e, p) { try { return await AU.signInWithEmailAndPassword(auth, e, p); } catch (x) { throw wrapErr(x); } },

      createAccount: async function (e, p) {
        const name = 'sec' + Date.now();
        const a2 = A.initializeApp(cfg, name);
        try {
          const g = AU.getAuth(a2);

const CR={img:null,z:1,ox:0,oy:0,st:null,size:280};
function openCropper(st,file){if(!file)return;const url=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{CR.img=im;CR.z=1;CR.ox=0;CR.oy=0;CR.st=st;showCropper();URL.revokeObjectURL(url)};im.onerror=()=>toast('This photo could not be opened, choose another.');im.src=url}
function cropDraw(cv,size){const im=CR.img,k=size/CR.size,base=Math.max(CR.size/im.width,CR.size/im.height)*CR.z,w=im.width*base,h=im.height*base;
 const maxx=(w-CR.size)/2,maxy=(h-CR.size)/2;CR.ox=Math.max(-maxx,Math.min(maxx,CR.ox));CR.oy=Math.max(-maxy,Math.min(maxy,CR.oy));
 const c=cv.getContext('2d');cv.width=size;cv.height=size;c.fillStyle='#fff';c.fillRect(0,0,size,size);c.drawImage(im,((CR.size-w)/2+CR.ox)*k,((CR.size-h)/2+CR.oy)*k,w*k,h*k)}
function showCropper(){const st=CR.st;const sh=$('#sheet');sh.hidden=false;sh.innerHTML=`<div><h2>${esc(st.name)} — Photo</h2><p class="muted small">Drag with your finger and zoom with the slider below. Keep the face in the centre.</p>

<input type="range" id="zm" min="1" max="4" step="0.01" value="1" style="width:100%;margin-block:10px">
<div class="row"><button class="btn sec grow" id="cc">Cancel</button><button class="btn grow" id="cs">Save photo</button></div></div>`;
 const cv=$('#crop');const draw=()=>cropDraw(cv,280);draw();let drag=null;
 cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:CR.ox,oy:CR.oy};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!drag)return;CR.ox=drag.ox+(e.clientX-drag.x);CR.oy=drag.oy+(e.clientY-drag.y);draw()};
 cv.onpointerup=cv.onpointercancel=()=>drag=null;
 $('#zm').oninput=e=>{CR.z=parseFloat(e.target.value);draw()};
 $('#cc').onclick=()=>openStudent(st.id);
 $('#cs').onclick=async()=>{const b=$('#cs');b.disabled=true;b.textContent='Saving…';
  const big=document.createElement('canvas'),sm=document.createElement('canvas');cropDraw(big,450);cropDraw(sm,80);
  const full=big.toDataURL('image/jpeg',0.85),th=sm.toDataURL('image/jpeg',0.8),at=Date.now();
  try{await save(()=>S.db.doc('photos/'+st.id).set({d:full,cls:st.cls,at}));await save(()=>S.db.doc('thumbs/'+st.id).set({d:th,cls:st.cls,at}));bump('photos');
   photoCache[st.id]={at,d:full};S.thumbs[st.id]={d:th,cls:st.cls,at};S.justPhoto=st.id;toast('Photo saved ✔');openStudent(st.id);refresh()}

// students this user may see. _own: belongs to (one of) my classes; _grp: the list group it is shown under
function scopeStudents(){const a=allStudents();
 if(can('all')){a.forEach(s=>{s._own=true;s._grp=s.cls});return a}
 const mc=new Set(myCls()),out=[];
 a.forEach(s=>{if(mc.has(s.cls)){s._own=true;s._grp=s.cls;out.push(s)}else if(s.seat&&mc.has(s.seat)){s._own=false;s._grp=s.seat;out.push(s)}});return out}
function canTouch(st){if(can('all'))return true;const mc=myCls();return mc.includes(st.cls)||(st.seat&&mc.includes(st.seat))}

function copyText(t){const done=()=>toast('Copied ✔');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fb())}else fb()}catch(e){fb()}

const rnd=(n,al)=>{const a=new Uint32Array(n);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*4294967296)}let s='';for(let i=0;i<n;i++)s+=al[a[i]%al.length];return s};

// ---- deliver a finished file: save it, or share it (WhatsApp etc.) through the phone's share sheet.
// Sharing needs a fresh tap (browsers refuse it after a long wait), so it is offered as a button once the file is ready.
function deliver(filename,blob){return new Promise(res=>{const type=blob.type||(/\.pdf$/i.test(filename)?'application/pdf':/\.zip$/i.test(filename)?'application/zip':/\.png$/i.test(filename)?'image/png':'application/octet-stream');
 const file=new File([blob],filename,{type});let canShare=false;try{canShare=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 const d=$('#dlg');d.hidden=false;
 d.innerHTML=`<div><b>File ready ✔</b><p class="small" style="margin:6px 0 10px;overflow-wrap:anywhere">${esc(filename)} · ${(blob.size/1048576).toFixed(1)} MB</p><div class="row">${canShare?'<button class="btn grow" id="dv_sh">↗ Share (WhatsApp etc.)</button>':''}<button class="btn ${canShare?'sec ':''}grow" id="dv_sv">💾 Save</button></div>${canShare?'':'<p class="muted small" style="margin:8px 0 0">Direct sharing is not available in this browser/phone — tap "Save", then open WhatsApp and attach this file.</p>'}<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sec" id="dv_x">Close</button></div></div>`;
 const close=()=>{unbusy();res()};$('#dv_x').onclick=close;
 $('#dv_sv').onclick=async()=>{await dl(filename,blob);close()};
 if(canShare)$('#dv_sh').onclick=async()=>{try{await navigator.share({files:[file],title:filename});close()}catch(e){if(e&&e.name==='AbortError'){return}
   unbusy();toast('Direct sharing did not work here — saving the file; after saving, open WhatsApp and attach it.',6000);await dl(filename,blob);res()}}})}

// SHA-256 (WebCrypto when available, plain JS fallback)
function sha256js(str){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const bytes=Array.from(new TextEncoder().encode(str)),bitLen=bytes.length*8;
 bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
 const hi=Math.floor(bitLen/4294967296),lo=bitLen>>>0;[hi,lo].forEach(v=>{for(let i=3;i>=0;i--)bytes.push((v>>>(i*8))&255)});
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],w=new Array(64);
 const R=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<bytes.length;o+=64){
  for(let i=0;i<16;i++)w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
  for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function sha(s){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256js(s)}

function authMsg(e){const c=e&&e.code;
 if(c==='invalid_credential'||c==='wrong_password'||c==='user_not_found'||c==='invalid_login_credentials')return'Wrong password (or e-mail).';
 if(c==='invalid_email')return'This e-mail address is not valid.';
 if(c==='too_many_requests')return'Too many attempts. Wait a few minutes and try again.';
 if(c==='network_request_failed')return'Network problem. Check the internet and try again.';
 if(c==='weak_password')return'Password is too weak — use at least '+MINPW+' letters/digits.';
 if(c==='email_already_in_use')return'This e-mail already has an account.';
 if(c==='requires_recent_login')return'For safety, log out, log in again and then change the password.';
 if(c==='operation_not_allowed')return'Email/Password sign-in is not switched on in Firebase (Authentication → Sign-in method).';
 if(c==='user_disabled')return'This account has been disabled.';
 return'Login problem ('+(c||'error')+'). Try again.'}

const heroHTML=()=>`<div class="hero"><img src="${HERO}" alt=""><div class="lgw"><img src="${LOGO}" alt=""><span>Welcome · ID Card &amp; Student Records</span></div></div>`;
function viewLogin(){const v=$('#view');
 if(!S.loginLoaded){v.innerHTML='<p class="muted">Loading…</p>';return}
 if(L.mode==='forgot')return viewForgot();
 if(!S.login.admin)return viewFirstRun();
 const names=Object.entries(S.login).filter(([id,s])=>s.cat===L.cat&&id!=='admin').sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name)));
 const isAdm=L.cat==='admin';
 v.innerHTML=`${heroHTML()}<div class="box" style="margin-top:14px"><h2>Login</h2>
<label class="f">1. Choose category</label><select id="l_cat"><option value="">— Select —</option>${CATS.map(c=>`<option value="${c[0]}" ${L.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
${isAdm?`<label class="f">2. Admin e-mail</label><input type="email" id="l_em" autocomplete="username" autocapitalize="off" value="${esc(lastAdminEmail())}">${pwField('l_pw','3. Password')}${showRow}<div class="row" style="margin-top:12px"><button class="btn grow" id="l_go">Login</button></div><p class="small" style="margin:10px 0 0"><a href="#" id="l_forgot">Forgot password?</a></p>`
 :(L.cat?(names.length?`<label class="f">2. Choose your name</label><select id="l_sid"><option value="">— Select —</option>${names.map(([id,s])=>`<option value="${esc(id)}" ${L.sid===id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:'<p class="warn" style="margin:12px 0 0"><b>No staff available in this category.</b></p>'):'')}
${!isAdm&&L.sid&&S.login[L.sid]?`${pwField('l_pw','3. Password')}${showRow}<div class="row" style="margin-top:12px"><button class="btn grow" id="l_go">Login</button></div><p class="small" style="margin:10px 0 0"><a href="#" id="l_forgot">Forgot password?</a></p>`:''}
<p class="muted small" style="margin:14px 0 0">Hindi digits (१२३) and extra spaces in the password are corrected automatically.</p></div>`;
 $('#l_cat').onchange=e=>{L.cat=e.target.value;L.sid='';const l=Object.entries(S.login).filter(([id,s])=>s.cat===L.cat&&id!=='admin');if(L.cat!=='admin'&&l.length===1)L.sid=l[0][0];viewLogin()};
 const sl=$('#l_sid');if(sl)sl.onchange=e=>{L.sid=e.target.value;viewLogin()};
 bindShow();
 if($('#l_go')){$('#l_go').onclick=doLogin;$('#l_pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#l_forgot').onclick=e=>{e.preventDefault();L.mode='forgot';viewLogin()}}}

async function doLogin(){const pw=normPw($('#l_pw').value);if(!pw)return toast('Enter the password.');

const STX=['gender','cat2','mother','stopno','spec','sc','tmp','elder','pd','nobus','att','lm'];
const STF=['id','name','roll','father','contact','contact2','village','native','route1','stop1','route2','stop2','seat','sr','adm'].concat(STX);
const pack=s=>{const o={};STF.forEach(k=>{const v=s[k]||'';if(v||!STX.includes(k))o[k]=v});['left','hold'].forEach(k=>{if(s[k]&&s[k].r)o[k]=s[k]});return o};
async function writeClass(doc){const json=JSON.stringify(doc);if(new Blob([json]).size>245000)throw{code:'invalid_argument',message:'Class is too large'};await save(()=>S.db.doc('classes/'+classKey(doc.name)).set(doc))}
function findStudent(id){return allStudents().find(s=>s.id===id)}
const HFLD={name:'Name',cls:'Class',seat:'Seating',roll:'Roll',father:'Father',mother:'Mother',contact:'Father mobile',contact2:'Mother mobile',village:'Village',native:'Native',route1:'Route 1',stop1:'Stop 1',route2:'Route 2',stop2:'Stop 2',sr:'SR',adm:'Admission',gender:'Gender',cat2:'Category',stopno:'Stop no.',spec:'Special no.',att:'Attendance no.',lm:'Landmark',sc:'Staff child',tmp:'Not in PSP list',elder:'Elder',nobus:'No bus',pd:'Printed'};
function diffText(o,n){const out=[];Object.keys(HFLD).forEach(k=>{const a=String(o[k]||''),b=String(n[k]||'');if(a!==b)out.push(HFLD[k]+': '+(a||'-')+' → '+(b||'-'))});return out.join('; ')}
function logHist(act,st,detail){if(!S.me)return;const id='h'+Date.now().toString(36)+rnd(4,'abcdefghjkmnpqrstuvwxyz');const d={at:Date.now(),by:S.me.id,byName:S.me.name,act,sid:(st&&st.id)||'',sname:(st&&st.name)||'',cls:(st&&st.cls)||'',d:String(detail||'').slice(0,400)};enqueue(()=>S.db.doc('hist/'+id).set(d)).catch(()=>{})}
async function binStudent(st){if(/^DEMO-/.test(st.id))return;const ph=S.thumbs[st.id]?await fullPhoto(st.id):null;const d={s:pack(st),cls:st.cls,ckey:st.ckey,at:Date.now(),by:(S.me&&S.me.name)||'',th:(S.thumbs[st.id]||{}).d||'',ph:ph||'',rte:st.rte?1:0,dob:(S.priv[st.id]||{}).dob||''};if(JSON.stringify(d).length>900000)d.ph='';await enqueue(()=>S.db.doc('bin/'+cleanId(st.id+'_'+d.at)).set(d))}
async function purgeBin(){try{const old=await S.db.query('bin',{where:[['at','<',Date.now()-30*864e5]],limit:100});for(const d of old)await enqueue(()=>S.db.doc('bin/'+d.id).delete())}catch(e){}}
async function autoBak(keys,label){if(!isAdmin())return;const at=Date.now(),ks=keys.filter(k=>S.classes[k]);for(const k of ks){const c=S.classes[k];await enqueue(()=>S.db.doc('bak/'+k).set({at,name:c.name,doc:c,job:label}))}await enqueue(()=>S.db.doc('meta/lastjob').set({at,job:label,keys:ks}))}
async function saveStudent(n,old){const key=classKey(n.cls);const cur=S.classes[key]||{name:n.cls,students:[]};
 const ns=(cur.students||[]).filter(s=>s.id!==n.id);ns.push(pack(n));const doc=cdoc(cur,{students:ns});await writeClass(doc);S.classes[key]=doc;
 if(old&&old.ckey!==key){const oc=S.classes[old.ckey];if(oc){const d2=cdoc(oc,{students:(oc.students||[]).filter(s=>s.id!==n.id)});await writeClass(d2);S.classes[old.ckey]=d2}
  if(S.thumbs[n.id]){await save(()=>S.db.doc('thumbs/'+n.id).update({cls:n.cls}));await save(()=>S.db.doc('photos/'+n.id).update({cls:n.cls})).catch(()=>{})}}
 {const df=old?diffText(old,n):'New student';if(df)logHist(old?'edit':'add',n,df)}
 refresh()}
async function delStudent(st,quiet){const oc=S.classes[st.ckey];if(!oc)return;await binStudent(st);logHist('delete',st,'Deleted (kept in recycle bin 30 days)');const d=cdoc(oc,{students:oc.students.filter(s=>s.id!==st.id)});await writeClass(d);S.classes[st.ckey]=d;
 const shared=allStudents().some(s=>s.id===st.id); // same ID still used elsewhere: keep its photo/RTE
 if(!shared&&S.thumbs[st.id]){await save(()=>S.db.doc('thumbs/'+st.id).delete());await save(()=>S.db.doc('photos/'+st.id).delete()).catch(()=>{});delete S.thumbs[st.id]}
 if(!shared&&S.rte[st.id]){await save(()=>S.db.doc('rte/'+st.id).delete()).catch(()=>{});delete S.rte[st.id]}
 if(!quiet){closeSheet();toast('Deleted.')}refresh()}
async function setRte(id,v,quiet){if((!!(S.rte[id]&&S.rte[id].v===1))===v)return;try{const d={v:v?1:0,at:Date.now()};await save(()=>S.db.doc('rte/'+id).set(d));S.rte[id]=d;if(!quiet){toast(v?'RTE: Yes — -R added at the end of ID':'RTE: No');openStudent(id);refresh()}}catch(e){toast(errMsg(e),6000)}}
function lateOf(c){if(!(c.ok&&c.okAt))return 0;return studentsOf(c.name).filter(s=>{const t=S.thumbs[s.id],r=S.rte[s.id],ci=S.cinfo[s.seatKey];return(t&&t.at>c.okAt)||(r&&r.at>c.okAt)||(ci&&ci.at>c.okAt)}).length}

async function mkTablePdf(title,H,rows){busy('Creating PDF…');try{await lib('jspdf');const land=H.length>6,W=land?297:210,Hh=land?210:297;const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:land?'landscape':'portrait'});
 const m=10,tw=W-2*m;const wts=H.map((h,i)=>i===0?4:Math.max(8,Math.min(26,Math.max(String(h).length,...rows.slice(0,60).map(r=>String(r[i]||'').length)))));const sum=wts.reduce((a,b)=>a+b,0),cw=wts.map(x=>x/sum*tw);
 const lh=6;let y=m+8,page=1;const head=()=>{pdf.setFontSize(12);pdf.text(S.settings.name+' — '+title+'  ('+rows.length+')  '+fmtDate(today()),m,m+2);pdf.setFontSize(8);let x=m;H.forEach((h,i)=>{pdf.text(String(h),x,y);x+=cw[i]});y+=2;pdf.line(m,y,W-m,y);y+=lh-1};head();
 rows.forEach(r=>{if(y>Hh-m){pdf.addPage();page++;y=m+8;head()}let x=m;pdf.setFontSize(8);r.forEach((c,i)=>{const mx=Math.max(2,Math.floor(cw[i]/1.55));let t=String(c==null?'':c);if(t.length>mx)t=t.slice(0,mx-1)+'…';pdf.text(t,x,y);x+=cw[i]});y+=lh});
 const blob=pdf.output('blob');unbusy();await deliver('RIS_'+title.replace(/[^A-Za-z0-9]+/g,'_')+'.pdf',blob)}catch(e){unbusy();toast('PDF could not be created: '+(e&&e.message||e))}}

   h+=`<div class="pgm" style="left:${x*mm}px;top:${y*mm}px;width:${g.W*mm}px;height:${g.H*mm}px;overflow:hidden">${inner}</div>`});h+='</div>'}
 h+='</div></div>';sh.innerHTML=h;
 $('#pv_x').onclick=closeSheet;$('#pv_l').onchange=e=>{S.layout=e.target.value;printPreview(cn)};$('#pv_m').onchange=e=>{PV.mode=e.target.value;printPreview(cn)};$('#pv_p').onchange=e=>{S.onlyPhoto=e.target.checked;printPreview(cn)};

ectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}\nfunction dbAll(){return new Promise(res=>{try{const q=idb.transaction('p').objectStore('p').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}\nfunction dbPut(o){return new Promise(res=>{try{const t=idb.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}\nfunction dbDel(id){return new Promise(res=>{try{const t=idb.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}\n// ---- list\nconst stu=D.students;\nfunction counts(){const mine=stu.filter(s=>!s.has);const done=mine.filter(s=>photos[s.id]).length;return{total:mine.length,done}}\nfunction render(){const q=$('#q').value.trim().toLowerCase(),pend=$('#pend').checked;const c=counts();\n $('#h1').textContent=D.school;$('#sub').textContent='Photo collection — '+D.teacher+(D.classes.length?' · '+D.classes.join(', '):'');\n $('#cnt').textContent=c.done+' of '+c.total+' photos done'+(stu.length-c.total?' ('+(stu.length-c.total)+' already have a photo in the app)':'');\n $('#pb').style.width=(c.total?c.done/c.total*100:0)+'%';$('#send').textContent='Send photos to admin ('+c.done+')';$('#send').disabled=!c.done;\n let a=stu.filter(s=>!q||[s.name,s.id,s.roll,s.father,s.cls].some(x=>String(x||'').toLowerCase().includes(q)));\n if(pend)a=a.filter(s=>!s.has&&!photos[s.id]);\n const g={};a.forEach(s=>(g[s.cls]=g[s.cls]||[]).push(s));let h='';\n Object.keys(g).forEach(k=>{h+='<div class=\"grp\">Class '+esc(k)+'<\/div>'+g[k].map(s=>{const p=photos[s.id];\n  return '<div class=\"it\" data-id=\"'+esc(s.id)+'\"><div class=\"th\">'+(p?'<img src=\"'+p.d+'\">':(s.has?'In app':'No<br>photo'))+'<\/div><div class=\"grow\"><div class=\"nm\">'+esc(s.name)+'<\/div><div class=\"mu\">Roll '+esc(s.roll||'-')+' · '+esc(s.id)+(s.father?' · F: '+esc(s function qpDec(s){try{return decodeURIComponent(s.replace(/=([0-9A-Fa-f]{2})/g,'%$1'))}catch(e){return s.replace(/=([0-9A-Fa-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)))}}
function parseVcf(txt){txt=String(txt||'').replace(/\r\n?/g,'\n').replace(/=\n/g,'').replace(/\n[ \t]/g,'');const out=[];
 txt.split(/BEGIN:VCARD/i).slice(1).forEach(card=>{let fn='',nn='';const tels=[];
  card.split('\n').forEach(line=>{const i=line.indexOf(':');if(i<0)return;const K=line.slice(0,i).toUpperCase(),v0=line.slice(i+1);const val=/ENCODING=QUOTED-PRINTABLE/.test(K)?qpDec(v0):v0;
   if(/^FN(;|$)/.test(K))fn=val.trim();else if(/^N(;|$)/.test(K))nn=val.split(';').filter(Boolean).reverse().join(' ').trim();
   else if(/^(ITEM\d+\.)?TEL(;|$)/.test(K)){const d=nd(val).replace(/\D/g,'');if(d.length>=10){const t=d.slice(-10);if(!tels.includes(t))tels.push(t)}}});
  const n=(fn||nn).replace(/\s+/g,' ').trim();if(n&&tels.length)out.push({n,t:tels})});return out}
const toks=s=>String(s||'').toLowerCase().replace(/[^a-zऀ-ॿ\s]/g,' ').split(/\s+/).filter(Boolean);
const tokEq=(a,b)=>a===b||(a.length>=4&&b.length>=4&&lev(a,b)<=1);
function cInfo(c){if(c._i)return c._i;const t=c.n.split(/\s+/);let tag='',stu=false;if(t.length>1&&/^[A-Za-z]$/.test(t[0])){tag=t[0].toUpperCase();stu=tag==='S';t.shift()}
 const nm=t.join(' ');return c._i={tag,stu,name:nm,tk:toks(nm),last:t.length>1?t[t.length-1]:''}}
function mScore(a,b,strict){if(!a.length||!b.length)return 0;const used=new Set();let m=0;a.forEach(x=>{const j=b.findIndex((y,k)=>!used.has(k)&&(strict?x===y:tokEq(x,y)));if(j>=0){used.add(j);m++}});return m/Math.max(a.length,b.length)}
function matchContact(st,c){const ci=cInfo(c),sk=toks(st.name);const s1=mScore(sk,ci.tk);const s2=ci.tk.length>=3?mScore(sk,ci.tk.slice(0,-1)):0;const drop=s2>s1;const sc=Math.max(s1,s2);const x1=mScore(sk,ci.tk,true),x2=ci.tk.length>=3?mScore(sk,ci.tk.slice(0,-1),true):0;return{c,sc:ci.stu?sc:sc*0.9,ex:ci.stu&&Math.max(x1,x2)>=0.999,vil:drop?vu(ci.last):''}}
function cVillage(c){const ci=cInfo(c);if(!ci.last)return'';const v=vu(ci.last);return villageList().some(x=>vu(x)===v)?v:''}

function nameGender(name){const w=String(name||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);if(!w.length)return null;let f=0,m=0,why=[];const first=w[0],last=w[w.length-1];
 if(last==='kumari'||last==='devi'||last==='bai'||last==='kaur'||last==='begum'||last==='khatoon'||last==='bano'){f+=3;why.push('"'+last+'" is used for girls')}
 else if(last==='kumar'&&w.length>1){m+=3;why.push('"Kumar" is used for boys')}
 if(FNAMES.has(first)&&!MNAMES.has(first)){f+=2;why.push('"'+first+'" is a girl\'s name')}else if(MNAMES.has(first)&&!FNAMES.has(first)){m+=2;why.push('"'+first+'" is a boy\'s name')}
 if(!f&&!m)return null;if(f>=m+2)return{g:'F',why:why.join(', ')};if(m>=f+2)return{g:'M',why:why.join(', ')};return null}

 for(const k of keys){const c=S.classes[k];const m={};byK[k].forEach(it=>m[it.id]=it.g);const d=cdoc(c,{students:(c.students||[]).map(s=>m[s.id]?pack(Object.assign({},s,{gender:m[s.id]})):s)});await writeClass(d);S.classes[k]=d}

async function saveDue(id){const s=allStudents().find(x=>x.id===id);if(!s)return;const box=document.querySelector(`[data-dr="${CSS.escape(id)}"]`),f={};
 box.querySelectorAll('[data-df]').forEach(i=>{const v=i.value.trim();if(v)f[i.dataset.k]=v});

 if(f.contact){f.contact=mob10(f.contact);if(f.contact.length!==10)return toast('The number must have 10 digits.',4500)}
 if(f.route1)f.route1=f.route1.trim();
 try{const rest={};
  if(f.contact){const d={f:f.contact,m:(S.contacts[id]||{}).m!==undefined?S.contacts[id].m:(s.contact2||''),by:S.me.id,at:Date.now()};await save(()=>S.db.doc('contacts/'+id).set(d));S.contacts[id]=d;delete f.contact}
  if(f.village){const V=vu(f.village);delete f.village;await setVillageFor(s,V)}
  ['roll','sr','father','mother','spec','route1'].forEach(k=>{if(f[k]!==undefined)rest[k]=(k==='father'||k==='mother')?tc(f[k]):f[k]});
  if(Object.keys(rest).length){if(can('edit')){const n=Object.assign({},s,rest);if(rest.roll&&allStudents().some(x=>x.id!==id&&x.cls===n.cls&&x.roll===rest.roll))return toast('This roll number is already used in the class.',5000);await saveStudent(n,s)}else await sendSuggest2(s,rest)}
  logHist('due',s,'ID card entries filled');toast('Saved ✔ '+s.name,2500);const y=window.scrollY;renderAll(true);window.scrollTo(0,y)}catch(e){toast(errMsg(e),6000)}}
async function sendSuggest2(st,fields){const id='s_'+Date.now().toString(36)+rnd(3,'abcdefghjkmnpqrstuvwxyz'),d={kind:'edit',sid:st.id,sname:st.name,cls:st.cls,fields,by:S.me.id,byName:S.me.name,at:Date.now()};await enqueue(()=>S.db.doc('suggest/'+id).set(d));S.suggest[id]=d;bump('sugg')}

async function loadImg(file){try{if(window.createImageBitmap)return await createImageBitmap(file)}catch(e){}

function sqCrop(img,size){const w=img.width||img.naturalWidth,h=img.height||img.naturalHeight,side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)*0.4;const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,sx,sy,side,side,0,0,size,size);return c}
const natCmp=(a,b)=>String(a).localeCompare(String(b),'en',{numeric:true});
async function planBulk(files){const stu=bulkStudents(BK.cls);if(!stu.length){toast('There are no students in this class.');return}
 const fi=files.map(f=>({f,name:f.name.split(/[\\/]/).pop(),base:f.name.split(/[\\/]/).pop().replace(/\.[^.]+$/,'')}));const pairs=[],unmatched=[];
 if(BK.mode==='order'){fi.sort((a,b)=>natCmp(a.name,b.name));fi.forEach((x,i)=>{if(stu[i])pairs.push([x,stu[i]]);else unmatched.push(x.name)})}
 else fi.forEach(x=>{let hit=[];const n=alnum(x.base);
  if(BK.mode==='roll'){const m=x.base.match(/\d+/);if(m)hit=stu.filter(s=>parseInt(s.roll,10)===parseInt(m[0],10))}
  else if(BK.mode==='id'){hit=stu.filter(s=>{const sid=alnum(s.id);return n===sid||n.includes(sid)||(/^\d{1,4}$/.test(x.base)&&sid.endsWith(x.base.padStart(4,'0')))})}
  else{const low=x.base.toLowerCase();hit=stu.filter(s=>alnum(s.name)===n||String(s.name).toLowerCase().split(/\s+/).filter(t=>t.length>=2).every(t=>low.includes(t)))}
  hit.length===1?pairs.push([x,hit[0]]):unmatched.push(x.name)});
 busy('Checking photos…');const used=new Set(),items=[];
 try{for(let i=0;i<pairs.length;i++){busyP(`${i+1} / ${pairs.length}`,i/pairs.length);const [x,s]=pairs[i];
   if(used.has(s.id)){items.push({s,name:x.name,status:'dup'});continue}used.add(s.id);
   if(hasThumb(s.id)){items.push({s,name:x.name,status:'has'});continue}
   try{const im=await loadImg(x.f);const big=sqCrop(im,450),sm=sqCrop(im,80);items.push({s,name:x.name,status:'ok',on:true,d:big.toDataURL('image/jpeg',0.85),th:sm.toDataURL('image/jpeg',0.8)})}catch(e){unmatched.push(x.name+' (photo could not be opened)')}await new Promise(r=>setTimeout(r,0))}
  unbusy();BK.items=items;BK.unmatched=unmatched;BK.nofile=stu.filter(s=>!used.has(s.id));viewBulk()}catch(e){unbusy();toast('Check failed: '+(e&&e.message||e))}}

 try{await lib('JSZip');const z=await JSZip.loadAsync(f);const out=[];const ents=Object.values(z.files).filter(en=>!en.dir&&/\.(jpe?g|png|webp)$/i.test(en.name)&&!/__MACOSX|\/\./.test(en.name));
  for(const en of ents){const b=await en.async('blob');out.push(new File([b],en.name.split('/').pop(),{type:b.type||'image/jpeg'}))}
  unbusy();if(!out.length)return toast('No photos found in the ZIP.');planBulk(out)}catch(er){unbusy();toast('Could not open ZIP: '+(er&&er.message||er))}});

 const byId={},byKey={};const reg=(s,k)=>{byId[s.id]={s,k};byKey[(s.name+'|'+s.roll+'|'+cur[k].name).toLowerCase()]=s.id};for(const k in cur)cur[k].students.forEach(s=>reg(s,k));

   const o=hit.s,n=Object.assign({},o);['name','roll','father','contact','contact2','village','native','route1','stop1','route2','stop2','seat','sr','adm','mother','gender','cat2','stopno','spec','sc','tmp'].forEach(f=>{if(r[f])n[f]=r[f]});

  if(!cur[key])cur[key]={name:r.cls,floor:'',room:'',students:[]};cur[key].students.push(n);touched.add(key);byId[id]={s:n,k:key};byKey[(n.name+'|'+n.roll+'|'+r.cls).toLowerCase()]=id;nNew++});

function repBus(){const b=$('#rpBody');const all=allStudents();const bus=all.filter(s=>!s.nobus&&(s.route1||s.village));const nob=all.filter(s=>s.nobus).length;const BD=busDoc();
 const vil={},rt={};bus.forEach(s=>{const v=vu(s.village)||'(no village)';(vil[v]=vil[v]||[]).push(s);const r=routeNum(s.route1)||'(no route)';const stop=(vu(s.stop1)||v)+(s.stopno?' · stop '+s.stopno:'');((rt[r]=rt[r]||{})[stop]=rt[r][stop]||[]).push(s)});
 const vk=Object.keys(vil).sort(),rk=rKeys(rt);const rcount=r=>Object.keys(rt[r]).reduce((a,k)=>a+rt[r][k].length,0);
 const vbreak=k=>{const m={};vil[k].forEach(s=>{const r=routeNum(s.route1)||'(no route)';m[r]=(m[r]||0)+1});return rKeys(m).map(r=>'Route '+r+' ('+m[r]+')').join(', ')};
 const vrows=vk.map(k=>[k,vil[k].length,vbreak(k)]);
 const srows=[];rk.forEach(r=>Object.keys(rt[r]).sort((x,y)=>(parseInt((x.match(/stop (\d+)/)||[])[1],10)||999)-(parseInt((y.match(/stop (\d+)/)||[])[1],10)||999)||x.localeCompare(y)).forEach(st=>srows.push([r,BD.buses[r]||'',st,rt[r][st].length])));
 const brows=rk.map(r=>[BD.buses[r]||'(bus no. not set)','Route '+r,rcount(r)]);
 b.innerHTML=`<div class="box"><b>${bus.length}</b> children use the bus (primary route) · <b>${nob}</b> marked "no bus" · <b>${all.filter(s=>!s.nobus&&!s.route1&&!s.village).length}</b> not filled yet<div class="row" style="margin-top:8px"><button class="btn sec sm" id="bs_x">Download</button></div></div>
<div class="box"><h3>Bus-wise (bus number → route)</h3>${tblHTML(['Bus number','Route','Children'],brows)}<div class="small muted" style="margin-top:4px">Bus numbers are typed inside each route in Timetable.</div></div>
<div class="box"><h3>Route-wise (route → stop → children)</h3>${rk.map(r=>{const stops=Object.keys(rt[r]);const n=rcount(r);return `<details style="margin-bottom:6px"><summary><b>Route ${esc(r)}</b>${BD.buses[r]?' · 🚌 '+esc(BD.buses[r]):''} ${cn(n)} <span class="muted small">${stops.length} stop(s)</span></summary>${stops.sort().map(k=>`<details style="margin-left:14px"><summary>${esc(k)} ${cn(rt[r][k].length)}</summary><div class="small" style="margin-left:14px">${rt[r][k].map(s=>esc(s.name)+' <span class="muted">('+esc(s.cls)+')</span>').join('<br>')}</div></details>`).join('')}</details>`}).join('')||'<p class="muted small">No data yet.</p>'}</div>
<div class="box"><h3>Village-wise (and how they come: route → children)</h3>${tblHTML(['Village','Children','Routes (children)'],vrows)}</div>`;
 $('#bs_x').onclick=()=>exportTableDialog('Bus_report',[['Bus-wise',['Bus number','Route','Children'],brows],['Route and stop',['Route','Bus no.','Stop','Children'],srows],['Village',['Village','Children','Routes (children)'],vrows]])}

async function restoreBin(id){const sn=await S.db.doc('bin/'+id).get();if(!sn.exists)throw{message:'Not found'};const b=sn.data(),s=b.s;if(findAny(s.id))throw{message:'A child with this ID already exists.'};
 const key=classKey(b.cls),cur=S.classes[key]||{name:b.cls,students:[]};const doc=cdoc(cur,{students:[...(cur.students||[]).filter(x=>x.id!==s.id),s],ok:false,okAt:0});await writeClass(doc);S.classes[key]=doc;
 const at=Date.now();if(b.ph){await save(()=>S.db.doc('photos/'+s.id).set({d:b.ph,cls:b.cls,at}))}if(b.th){await save(()=>S.db.doc('thumbs/'+s.id).set({d:b.th,cls:b.cls,at}));S.thumbs[s.id]={d:b.th,cls:b.cls,at}}
 if(b.rte){const d={v:1,at};await save(()=>S.db.doc('rte/'+s.id).set(d));S.rte[s.id]=d}if(b.dob){const d={dob:b.dob,at};await save(()=>S.db.doc('priv/'+s.id).set(d));S.priv[s.id]=d}
 await enqueue(()=>S.db.doc('bin/'+id).delete());logHist('restore',s,'Restored from recycle bin');refresh()}

function busCnt(all){all=all||allStudents();const r={},v={};
 all.forEach(s=>{const vl=vu(s.village);if(vl){v[vl]=v[vl]||{n:0,r:{}};v[vl].n++}
  if(s.nobus)return;const rn=routeNum(s.route1);if(!rn)return;const R=r[rn]=r[rn]||{n:0,s:{},l:{}};R.n++;const sk=vu(s.stop1)||vl||'(stop not filled)';R.s[sk]=(R.s[sk]||0)+1;(R.l[sk]=R.l[sk]||[]).push(s);
  if(vl)v[vl].r[rn]=(v[vl].r[rn]||0)+1});
 return{r,v}}
const cn=n=>`<span class="cn" title="children">${n}</span>`;
const rKeys=o=>Object.keys(o).sort((a,c)=>(parseInt(a,10)||999)-(parseInt(c,10)||999)||a.localeCompare(c));
function askText(title,def,cb){const d=$('#dlg');d.hidden=false;d.innerHTML=`<div><b>${esc(title)}</b><input type="text" id="at_v" value="${esc(def||'')}" style="margin-top:8px"><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sec" id="at_n">Cancel</button><button class="btn" id="at_y">OK</button></div></div>`;$('#at_n').onclick=unbusy;$('#at_y').onclick=()=>{const t=$('#at_v').value.trim();if(!t)return toast('Type a name.');unbusy();cb(t)};setTimeout(()=>{try{$('#at_v').focus()}catch(e){}},50)}
const pad2=n=>String(n).padStart(2,'0');
function shiftT(t,m){const x=String(t||'').match(/^(\d{1,2}):(\d{2})$/);if(!x)return t||'';let v=(+x[1])*60+(+x[2])+(m||0);v=((v%1440)+1440)%1440;return pad2(Math.floor(v/60))+':'+pad2(v%60)}
const t12=t=>{const x=String(t||'').match(/^(\d{1,2}):(\d{2})$/);if(!x)return'';let h=+x[1];const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+x[2]+' '+ap};
function busDoc(){const b=JSON.parse(JSON.stringify(S.meta.bus||{}));b.season=b.season||'summer';b.delay=+b.delay||0;b.summer=b.summer||{routes:{}};b.winter=b.winter||{routes:{}};b.buses=b.buses||{};b.cust=b.cust||{};if(b.season!=='summer'&&b.season!=='winter'&&!b.cust[b.season])b.season='summer';return b}

${extra.length?`<div style="margin-top:8px"><b class="small">Children at stops that are not in the timetable</b>${extra.map(k=>`<details class="stp"><summary>${esc(k)} ${cn(C.s[k])}</summary><div class="small" style="margin:6px 0 0 18px">${nm(k)}</div></details>`).join('')}</div>`:''}</div>`};
 const body=keys.map(card).join('')||'<div class="box"><p class="muted small">No route yet. Fill village and route for the children, or make routes in Timetable.</p></div>';
 v.innerHTML=`<h2>Routes</h2><p class="muted small">Every route with its stops in order, the morning pick-up time, the evening drop time, and how many children board at each stop. Tap a stop to see the children. Times include any delay.</p>

async function doPromote(ns){busy('Promoting…');try{const keys=Object.keys(S.classes);await autoBak(keys,'Promotion to '+ns);const nd2={},moved=[];
  const get=(name)=>nd2[name]||(nd2[name]=cdoc(S.classes[classKey(name)]||{name,students:[]},{students:[],ok:false,okAt:0}));
  keys.forEach(k=>{const c=S.classes[k];get(c.name);(c.students||[]).forEach(s=>{if(s.left){get(c.name).students.push(s);return}const t=promoTarget(c.name);const o=Object.assign({},s,{seat:'',pd:''});
    if(t==='ALUMNI'){o.left={r:'passed',d:today(),n:'Promotion '+ns};get(c.name).students.push(pack(o))}else if(t){get(t).students.push(pack(o));moved.push({id:s.id,cls:t})}else get(c.name).students.push(pack(o))})});
  const names=Object.keys(nd2);for(let i=0;i<names.length;i++){busyP(`Classes ${i+1} / ${names.length}`,i/names.length*.5);const dd=nd2[names[i]];await writeClass(dd);S.classes[classKey(names[i])]=dd}
  for(let i=0;i<moved.length;i++){if(i%10===0)busyP(`Photos ${i+1} / ${moved.length}`,.5+i/moved.length*.5);const m=moved[i];if(S.thumbs[m.id]){await save(()=>S.db.doc('thumbs/'+m.id).update({cls:m.cls})).catch(()=>{});await save(()=>S.db.doc('photos/'+m.id).update({cls:m.cls})).catch(()=>{});S.thumbs[m.id]=Object.assign({},S.thumbs[m.id],{cls:m.cls})}}
  const n=Object.assign({},S.settings,{session:ns});await save(()=>S.db.doc('settings/school').set(n));S.settings=withDef(n);logHist('promotion',{},'All classes promoted; session '+ns);unbusy();toast('Done ✔ — session '+ns,6000);renderAll(true)}catch(e){unbusy();toast(errMsg(e),7000)}}

  await enqueue(()=>S.db.doc('meta/lastjob').delete());logHist('undo',{},'Undid: '+lj.job);unbusy();toast('Undone ✔');renderAll(true)}catch(e){unbusy();toast(errMsg(e),7000)}},'Undo')}

 Object.entries(o.thumbs||{}).forEach(([k,v])=>jobs.push(['thumbs/'+k,v]));Object.entries(o.photos||{}).forEach(([k,v])=>jobs.push(['photos/'+k,v]));
 if(o.dupok)jobs.push(['meta/dupok',o.dupok]);if(o.design)jobs.push(['meta/design',o.design]);if(o.villages)jobs.push(['meta/villages',o.villages]);if(o.bus)jobs.push(['meta/bus',o.bus]);if(o.sib)jobs.push(['meta/sib',o.sib]);Object.entries(o.contacts||{}).forEach(([k,v])=>jobs.push(['contacts/'+k,v]));Object.entries(o.priv||{}).forEach(([k,v])=>jobs.push(['priv/'+k,v]));
 busy('Restoring data…');
 try{for(let i=0;i<jobs.length;i++){if(i%10===0)busyP(`${i+1} / ${jobs.length}`,i/jobs.length);const [p,d]=jobs[i];await enqueue(()=>S.db.doc(p).set(d))}

function demoAvatar(seed){const mk=sz=>{const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),k=sz/300,hue=(seed*47)%360;x.fillStyle=`hsl(${hue},45%,82%)`;x.fillRect(0,0,sz,sz);x.fillStyle=`hsl(${(hue+180)%360},40%,38%)`;x.beginPath();x.ellipse(150*k,310*k,105*k,95*k,0,0,7);x.fill();x.fillStyle='#e8b98f';x.fillRect(128*k,170*k,44*k,50*k);x.beginPath();x.arc(150*k,135*k,62*k,0,7);x.fill();x.fillStyle='#2b1d14';x.beginPath();x.arc(150*k,112*k,64*k,Math.PI,0);x.fill();x.fillStyle='#222';x.beginPath();x.arc(128*k,140*k,5*k,0,7);x.arc(172*k,140*k,5*k,0,7);x.fill();x.strokeStyle='#8a3d2a';x.lineWidth=3*k;x.beginPath();x.arc(150*k,158*k,16*k,.2,Math.PI-.2);x.stroke();return c.toDataURL('image/jpeg',0.85)};return{d:mk(300),th:mk(80)}}
